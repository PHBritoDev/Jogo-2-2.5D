<!doctype html><html><head><meta charset="utf-8"><title>QA Barragem Abissal</title><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script><style>body{margin:0;background:#101015;color:#fff;font:13px system-ui}label{position:absolute;top:8px;left:12px}</style></head><body><label>Enemy3 — Barragem Abissal · laboratório VFX</label><script type="module">
