<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Enemy2 · prévia</title>
<style>body{margin:0;background:#07050b;color:#f3e2ff;font:14px system-ui}canvas{display:block}header{position:absolute;top:12px;left:16px;pointer-events:none}h1{font:19px Georgia;letter-spacing:2px;color:#ff8fd6;margin:0 0 4px}footer{position:absolute;bottom:14px;left:14px;right:14px}button{background:#24102a;border:1px solid #ff4fae;color:#fde8ff;padding:9px 11px;border-radius:8px;margin:3px}</style>
<header><h1>ENEMY2 · TRINDADE</h1><p>Vórtice Abissal · Trindade do Caos · Colapso do Abismo · Foice do Vulcão Sepultado</p></header>
<footer><button data-k="vortex">VÓRTICE</button><button data-k="trinity">TRINDADE</button><button data-k="collapse">COLAPSO</button><button data-k="scythe">FOICE</button><button id="boss">MINI-CHEFE</button><button id="quality">QUALIDADE</button></footer>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
import * as T from 'three';
import {Enemy1Squad,SKILLS} from './enemy1-squad3d.js';import './enemy2-squad3d.js';import {createChaosVFX} from './enemy2-chaos-vfx3d.js';import {buildInfernalScythe} from './infernal-scythe3d.js';import {createSakugaImpacts} from './sakuga-impact3d.js';
const qs=new URLSearchParams(location.search);let kind=qs.get('k')||'vortex',boss=qs.has('boss'),quality=qs.has('low')?0:1;
const scene=new T.Scene();scene.background=new T.Color('#0a0710');scene.fog=new T.Fog('#0a0710',35,90);const camera=new T.PerspectiveCamera(50,innerWidth/innerHeight,.1,200);
const renderer=new T.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.toneMapping=T.ACESFilmicToneMapping;document.body.appendChild(renderer.domElement);
scene.add(new T.HemisphereLight(0xd8c8ff,0x2a2230,2));const sun=new T.DirectionalLight(0xffffff,1.3);sun.position.set(4,8,6);scene.add(sun);
const floor=new T.Mesh(new T.PlaneGeometry(140,140),new T.MeshStandardMaterial({color:0x2c2724,roughness:.95}));floor.rotation.x=-Math.PI/2;scene.add(floor);
const ground=()=>0;const heroM=new T.Mesh(new T.CapsuleGeometry(.32,1.1,6,12),new T.MeshStandardMaterial({color:0xd8d2c0}));scene.add(heroM);
const hero={id:'hero',team:'hero',x:0,y:0,z:0,vx:0,vz:0,radius:.42,height:1.8,alive:true,priority:1,iframes:false,air:0};
let sak=createSakugaImpacts(T,scene,{ground,capacity:8}),squad,vfx=createChaosVFX(T,scene,{ground}),freeze=false,foe=null,scy=null,heroHp=999,t0=0;
function start(){
 if(foe)scene.remove(foe);if(scy){scene.remove(scy);scy=null;}hero.x=0;hero.z=0;t0=0;
 squad=new Enemy1Squad({seed:3,ground,damageTarget:(id,n)=>{heroHp-=n;return 'hit';},event:(type,d)=>{const s=d&&d.spell,b=s&&s.kind==='e2boss';if(type==='vortexImpact')sak.emit({id:'v'+s.id+'_'+d.n,time:t0,point:{x:s.x,y:s.y,z:s.z},dir:{x:s.dx,z:s.dz},size:b?3.1:2.1,palette:b?'ember':'abyss',rocks:b?14:9,furrow:d.why==='ground'?3.5:1.5});if(type==='collapse_wave')sak.emit({id:'c'+s.id,time:t0,point:{x:s.x,y:s.y+.4,z:s.z},size:s.r*.85,palette:b?'ember':'abyss',rocks:b?15:11});}});squad.setTargets([hero]);
 const [a]=squad.spawn([{x:0,z:12,yaw:Math.PI,kind:boss?'e2boss':'e2'}]);a.alert=1e9;a.decideT=1e9;
 foe=new T.Mesh(new T.CapsuleGeometry(boss?.55:.42,boss?1.6:1.1,6,12),new T.MeshStandardMaterial({color:0x2a1830}));foe.position.set(0,boss?1.3:.95,12);scene.add(foe);
 if(kind==='vortex'){SKILLS.vortex.spawn(squad,a,hero);camera.position.set(11,5,2);camera.lookAt(0,2.4,6);}
 if(kind==='trinity'){SKILLS.trinity.spawn(squad,a,hero);camera.position.set(9,6,-9);camera.lookAt(0,2,4);}
 if(kind==='collapse'){SKILLS.collapse.spawn(squad,a,hero);camera.position.set(8,5,-8);camera.lookAt(0,2,0);}
 if(kind==='scythe'){scy=buildInfernalScythe(T);scy.position.set(0,1.2,0);scene.add(scy);hero.x=40;camera.position.set(.6,2.4,3.4);camera.lookAt(.5,2.1,0);}
}
function step(dt){t0+=dt;
 if(kind==='vortex'||kind==='trinity')hero.x=Math.sin(t0*.9)*2.2;
 squad.update(dt);heroM.position.set(hero.x,.87,hero.z);
 const info=vfx.update(dt,camera,squad.spells,[],quality);sak.update(t0,camera,quality);if(scy){scy.rotation.y+=dt*.5;scy.userData.tick(t0,1,0);}
 renderer.render(scene,camera);return info;}
let last=performance.now();function loop(){requestAnimationFrame(loop);if(freeze)return;const now=performance.now(),dt=Math.min(.05,(now-last)/1000);last=now;step(dt);if(kind!=='scythe'&&!squad.spells.length)start();}
document.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{kind=b.dataset.k;start();});document.getElementById('boss').onclick=()=>{boss=!boss;start();};document.getElementById('quality').onclick=()=>{quality=quality?0:1;};
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
start();loop();
window.preview={freeze(){freeze=true;},start,step,info(){return{calls:renderer.info.render.calls,tris:renderer.info.render.triangles,spells:squad.snapshot().spells,hp:heroHp};}};
</script></html>
