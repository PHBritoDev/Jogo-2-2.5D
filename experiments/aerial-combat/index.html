<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Laboratório · Combate aéreo</title>
<link rel="stylesheet" href="style.css"><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script></head><body>
<canvas id="view"></canvas><header><strong>Espada do Chamado <small>LAB 297.1</small></strong><span id="status">Preparando a arena…</span><div class="vitals"><span id="health">VIDA 100</span><span id="mana">MANA 40</span><span id="move">Em guarda</span></div></header>
<details id="settings"><summary>Ajustes e animações</summary><label><input id="prototype" type="checkbox" checked> Combate aéreo</label><label>Modelo <select id="rig"><option value="new">Novo protagonista</option><option value="old">Protagonista anterior</option></select></label><label>Qualidade <select id="quality"><option value="high">Alta</option><option value="low">Baixa</option></select></label><label><input id="lock" type="checkbox"> Foco suave no rival</label><label><input id="recenter" type="checkbox"> Recentralizar câmera</label><label><input id="shake" type="checkbox" checked> Impacto de câmera</label><label>Mouse <input id="mouse" type="range" min=".3" max="2" step=".1" value="1"></label><label>Toque <input id="touch" type="range" min=".3" max="2" step=".1" value="1"></label><label><input id="ai" type="checkbox" checked> Rival ativo</label><button id="restart">Reiniciar treino</button><hr><label>Animação <select id="clip"></select></label><label>Velocidade <select id="rate"><option value="1">1×</option><option value=".25">0,25×</option><option value="0">Pausa</option></select></label><button id="inspect">Inspecionar / voltar</button><div class="angles"><button data-angle="0">Frente</button><button data-angle="1.5708">Lado</button><button data-angle="3.14159">Costas</button></div><p>WASD · Shift dash · Espaço salto · J golpe · K magia · L foco. Arraste para olhar. Pinça aproxima.</p></details>
<div id="joystick" aria-label="Direção"><i></i></div><nav><button data-action="magic">MAGIA <small>K · 18 MP</small></button><button data-action="attack" class="attack">GOLPE <small>J</small></button><button data-action="dash">DASH <small>Shift</small></button><button data-action="jump">SALTO <small>Espaço</small></button></nav>
<script type="module" src="app.js?v=297-1"></script></body></html>
