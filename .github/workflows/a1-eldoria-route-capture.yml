name: A1 — captura contínua da floresta de Eldória

on:
  push:
    branches:
      - 'agentes/a1/eldoria-exterior-route-qa-mod361'
      - 'qa/a1/eldoria-route-mod371-ef5d328'
    paths:
      - '.github/workflows/a1-eldoria-route-capture.yml'
      - 'mundo-3d-prototype.js'
      - 'camera-water-clearance3d.js'
      - 'tools/visual-lab/agent-qa.cjs'
      - 'tools/visual-lab/agent-qa.test.cjs'
      - 'tools/visual-lab/scene-agent.cjs'
      - 'tools/visual-lab/scene-capture-core.cjs'
      - 'tools/visual-lab/scene-capture-core.test.cjs'
      - 'tools/visual-lab/photographer.cjs'
      - 'tools/visual-lab/photographer.test.cjs'
      - 'tools/visual-lab/camera-tree-fade.test.cjs'
      - 'tools/visual-lab/package.json'
      - 'act1-world-layout.js'
      - 'eldoria-city-layout.js'
      - 'eldoria-city-plaza.js'
      - 'eldoria-live-village3d.js'
      - 'build-info.js'

permissions:
  contents: read

concurrency:
  group: a1-eldoria-route-${{ github.ref }}
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    env:
      AGENT: A1
      SCENARIO: floresta-percurso
      VIDEO: 'true'
      PR: '707'
      VISUAL_OUTPUT: visual-lab-results
      VISUAL_BASE_URL: http://127.0.0.1:4173
      ARTIFACT_NAME: qa-A1-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preparar captura e navegador
        id: setup
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node --input-type=module -e 'import {BUILD, MOD} from "./build-info.js"; console.log("EXPECTED_BUILD="+BUILD+" (Mod "+MOD+")")' >> "$GITHUB_ENV"
          node --test tools/visual-lab/agent-qa.test.cjs tools/visual-lab/scene-capture-core.test.cjs tools/visual-lab/photographer.test.cjs tools/visual-lab/camera-tree-fade.test.cjs
          npm install --prefix tools/visual-lab --no-audit --no-fund
          ./tools/visual-lab/node_modules/.bin/playwright install --with-deps chromium
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/a1-route-http.log 2>&1 &
          for i in $(seq 1 40); do
            if curl --connect-timeout 2 --max-time 5 -fsS "$VISUAL_BASE_URL/mundo-3d-prototype.html" -o /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/a1-route-http.log
          exit 1
      - name: Gravar percurso contínuo no jogo real
        id: capture
        run: |
          export SCENE_AGENT_SCENES="$(node tools/visual-lab/agent-qa.cjs request)"
          timeout 420s node tools/visual-lab/scene-agent.cjs
      - name: Classificar evidências e gerar manifest
        if: always()
        env:
          SETUP: ${{ steps.setup.outcome }}
          CAPTURE: ${{ steps.capture.outcome }}
        run: node tools/visual-lab/agent-qa.cjs finish
      - name: Resumo da captura
        if: always()
        run: |
          for f in visual-lab-results/agent-qa/manifest.json visual-lab-results/scene-agent/index.md; do
            if [ -f "$f" ]; then cat "$f" >> "$GITHUB_STEP_SUMMARY"; printf '\n' >> "$GITHUB_STEP_SUMMARY"; fi
          done
      - name: Publicar vídeo, fotos, trace e manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-A1-${{ github.run_number }}
          path: visual-lab-results/
          retention-days: 14
          if-no-files-found: warn
