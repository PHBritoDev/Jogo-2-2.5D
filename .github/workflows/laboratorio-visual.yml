name: Laboratorio visual do jogo 3D

on:
  workflow_dispatch:
    inputs:
      cenario:
        description: "Qual habilidade gravar?"
        required: true
        default: ambos
        type: choice
        options:
          - ambos
          - hidra
          - chamas
          - agente
          - cinematica
  schedule:
    # Auditoria semanal sem depender de uma nova mensagem no chat (segunda 12:00 UTC).
    - cron: '0 12 * * 1'
  pull_request:
    branches: [main]
    paths:
      - "*.js"
      - "*.html"
      - "tools/visual-lab/**"
      - ".github/workflows/laboratorio-visual.yml"
  push:
    branches: [main]
    paths:
      - "*.js"
      - "*.html"
      - "*.glb"
      - "tools/visual-lab/**"
      - ".github/workflows/laboratorio-visual.yml"

permissions:
  contents: read

concurrency:
  group: laboratorio-visual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visualizar:
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.cenario != 'cinematica'
    name: Abrir, jogar e gravar o RPG
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: "true"
      VISUAL_SCENARIO: ${{ github.event.inputs.cenario || 'ambos' }}
      VISUAL_BASE_URL: http://127.0.0.1:4173
      VISUAL_OUTPUT: visual-lab-results

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instalar Playwright (isolado do jogo)
        run: npm install --prefix tools/visual-lab --no-audit --no-fund

      - name: Instalar Chromium e dependencias
        run: ./tools/visual-lab/node_modules/.bin/playwright install --with-deps chromium

      - name: Verificar todas as capacidades do agente V3
        run: |
          node --test tools/visual-lab/*.test.cjs
          node --test enemy1-integration.test.mjs zarkhael-hydra.test.mjs zarkhael-blackflame.test.mjs zarkhael-moon.test.mjs zarkhael-six-seals-ultimate.test.mjs vorgazhek-eclipse-sword.test.mjs vorgazhek-eclipse-sakuga.test.mjs
          node --input-type=module --check < mundo-3d-prototype.js

      - name: Iniciar servidor HTTP local do proprio commit
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/visual-lab-http.log 2>&1 &
          echo $! > /tmp/visual-lab-http.pid
          for i in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:4173/mundo-3d-prototype.html -o /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/visual-lab-http.log
          exit 1

      - name: Smoke essencial do carregamento 3D (bloqueia imports quebrados no PR)
        if: github.event_name == 'pull_request'
        run: node tools/visual-lab/world-load-smoke.cjs

      - name: Guardar evidencias do smoke mesmo se o mundo falhar
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: mundo3d-smoke-${{ github.run_number }}
          path: visual-lab-results/smoke-world/
          retention-days: 7
          if-no-files-found: warn

      - name: Restaurar memoria visual anterior
        if: github.event_name != 'pull_request'
        uses: actions/cache/restore@v4
        with:
          path: visual-lab-baseline/
          key: visual-v4-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            visual-v4-${{ runner.os }}-${{ github.ref_name }}-

      - name: Jogar via API QA, capturar frames, console e video
        if: github.event_name == 'push' || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.cenario != 'agente')
        run: node tools/visual-lab/run.cjs

      - name: Executar rodadas consecutivas de IA visual (2 + 1 condicional)
        if: github.event_name == 'push' || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.cenario == 'agente')
        run: node tools/visual-lab/rounds.cjs

      - name: Comparar imagens com a execucao de referencia
        if: always() && github.event_name != 'pull_request' && (github.event_name == 'push' || github.event_name == 'schedule' || github.event.inputs.cenario == 'agente')
        run: node tools/visual-lab/visual-memory.cjs

      - name: Auditoria semantica opcional (uma chamada de IA, somente se chave configurada)
        if: always() && github.event_name != 'pull_request' && (github.event_name == 'push' || github.event_name == 'schedule' || github.event.inputs.cenario == 'agente')
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          VISUAL_AI_MODEL: gpt-4.1-mini
        run: node tools/visual-lab/visual-ai.cjs

      - name: Preparar nova referencia apenas apos testes aprovados
        if: success() && github.event_name != 'pull_request' && (github.event_name == 'push' || github.event_name == 'schedule' || github.event.inputs.cenario == 'agente')
        run: node tools/visual-lab/visual-memory.cjs prepare

      - name: Persistir referencia visual em cache rotativo do GitHub
        if: success() && github.event_name != 'pull_request' && (github.event_name == 'push' || github.event_name == 'schedule' || github.event.inputs.cenario == 'agente')
        uses: actions/cache/save@v4
        with:
          path: visual-lab-baseline/
          key: visual-v4-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}


      - name: Verificar Eclipse Mod 274 em WebGL real (4 etapas, VFX ligado/desligado)
        if: always() && github.event_name == 'push'
        run: node tools/visual-lab/eclipse-sakuga-qa.cjs

      - name: Instalar FFmpeg para converter gravacoes a MP4
        if: always() && github.event_name != 'pull_request'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Converter videos WebM para MP4
        if: always() && github.event_name != 'pull_request'
        shell: bash
        run: |
          if command -v ffmpeg >/dev/null 2>&1; then
            shopt -s nullglob
            for video in visual-lab-results/videos/*.webm visual-lab-results/agente/videos/*.webm visual-lab-results/rodadas/rodada-*/agente/videos/*.webm; do
              ffmpeg -y -hide_banner -loglevel error -i "$video" -an -c:v libx264 -preset veryfast -crf 26 -pix_fmt yuv420p "${video%.webm}.mp4" || true
            done
          fi

      - name: Salvar log do servidor local
        if: always() && github.event_name != 'pull_request'
        shell: bash
        run: |
          mkdir -p visual-lab-results
          cp /tmp/visual-lab-http.log visual-lab-results/servidor.log 2>/dev/null || true

      - name: Guardar videos, screenshots e diagnostico mesmo se falhar
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: laboratorio-visual-${{ github.run_number }}
          path: visual-lab-results/
          retention-days: 14
          if-no-files-found: warn

  cinematica:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.cenario == 'cinematica')
    name: Gravar e auditar ultimate em tela mobile
    runs-on: ubuntu-24.04
    timeout-minutes: 26
    env:
      CI: "true"
      VISUAL_BASE_URL: http://127.0.0.1:4173
      VISUAL_OUTPUT: visual-lab-results
      CINEMA_SIZES: landscape,portrait
    steps:
      - name: Baixar codigo do jogo
        uses: actions/checkout@v4

      - name: Preparar Node.js para o laboratorio
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Dependencias Playwright
        run: npm install --prefix tools/visual-lab --no-audit --no-fund

      - name: Instalar Chromium para renderizacao real
        run: ./tools/visual-lab/node_modules/.bin/playwright install --with-deps chromium

      - name: Validar telemetria e pixels (V7)
        run: node --test tools/visual-lab/cinematic-criteria.test.cjs tools/visual-lab/cinematic-visual.test.cjs

      - name: Iniciar servidor local do commit
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/cinema-http.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/mundo-3d-prototype.html -o /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/cinema-http.log
          exit 1

      - name: Recuperar referencia por fase de runs anteriores
        if: github.event_name == 'push'
        uses: actions/cache/restore@v4
        with:
          path: visual-lab-cinema-baseline/
          key: cinema-v7-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            cinema-v7-${{ runner.os }}-${{ github.ref_name }}-

      - name: Rodar cena real em paisagem e retrato
        run: node tools/visual-lab/cinematic-run.cjs

      - name: Preservar memoria visual apenas apos testes completos
        if: success() && github.event_name == 'push'
        uses: actions/cache/save@v4
        with:
          path: visual-lab-cinema-baseline/
          key: cinema-v7-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Converter vídeos da cena para MP4
        if: always()
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          shopt -s nullglob
          for video in visual-lab-results/cinematica/*/videos/*.webm; do
            ffmpeg -y -hide_banner -loglevel error -i "$video" -an -c:v libx264 -preset veryfast -crf 27 -pix_fmt yuv420p "${video%.webm}.mp4" || true
          done

      - name: Anexar logs e evidencias, mesmo com erros
        if: always()
        run: |
          mkdir -p visual-lab-results/cinematica
          cp /tmp/cinema-http.log visual-lab-results/cinematica/servidor.log 2>/dev/null || true

      - name: Guardar video, imagens e telemetria da cena por 14 dias
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cinematica-mobile-${{ github.run_number }}
          path: visual-lab-results/cinematica/
          retention-days: 14
          if-no-files-found: warn

  eclipse_preview:
    if: github.event_name == 'pull_request' && github.head_ref == 'mod274-vorgazhek-eclipse-sakuga-crimson'
    name: Mod 274 — conferir VFX real antes do merge
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    env:
      VISUAL_BASE_URL: http://127.0.0.1:4173
      VISUAL_OUTPUT: visual-lab-results
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar ferramentas de teste
        run: npm install --prefix tools/visual-lab --no-audit --no-fund
      - name: Preparar navegador e WebGL SwiftShader
        run: ./tools/visual-lab/node_modules/.bin/playwright install --with-deps chromium
      - name: Iniciar servidor HTTP da branch
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/eclipse-http.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4173/vorgazhek-eclipse-preview.html -o /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/eclipse-http.log
          exit 1
      - name: Capturar quatro fases da espada e testar desenho dos VFX
        run: node tools/visual-lab/eclipse-sakuga-qa.cjs
      - name: Guardar evidencias da prévia mesmo em caso de falha
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eclipse-mod274-preview
          path: visual-lab-results/eclipse-274/
          retention-days: 14
          if-no-files-found: warn
