name: Bispo 2 — abyss WebGL evidence (no deployment)
on:
  pull_request:
    paths:
      - 'vorgazhek-abyss-*'
      - 'vorgazhek-eclipse-sword.test.mjs'
      - 'dimension-arenas3d.js'
      - 'dimensions3d.js'
      - 'tools/visual-lab/vorgazhek-abyss-*'
      - '.github/workflows/bispo2-abyss-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rules and source syntax
        run: |
          node --test dimensions3d.test.mjs vorgazhek-eclipse-sword.test.mjs
          node --input-type=module --check < vorgazhek-abyss-dimension3d.js
          node --input-type=module --check < dimension-arenas3d.js
          node --check tools/visual-lab/vorgazhek-abyss-qa.cjs
          node --check tools/visual-lab/vorgazhek-runtime-qa.cjs
      - name: Pinned browser dependencies
        run: |
          npm install --prefix work/qa --no-package-lock --ignore-scripts playwright@1.56.1 three@0.160.0
          work/qa/node_modules/.bin/playwright install --with-deps chromium
      - name: Render real Three.js and record evidence
        env:
          NODE_PATH: '${{ github.workspace }}/work/qa/node_modules'
          VISUAL_OUTPUT: '${{ github.workspace }}/work/evidence'
        run: |
          python3 -m http.server 4173 > /tmp/bispo2-http.log 2>&1 &
          node tools/visual-lab/vorgazhek-abyss-qa.cjs
          node tools/visual-lab/vorgazhek-runtime-qa.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bispo2-abyss-${{ github.sha }}
          path: work/evidence/
          retention-days: 14
