name: QA PC — movimento fantasma Alt-Tab
on:
  pull_request:
    paths:
      - 'mundo-3d-prototype.js'
      - 'pc-input-focus.test.mjs'
      - 'tools/visual-lab/focus-movement-qa.cjs'
      - '.github/workflows/focus-movement-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  focus:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Testar regressão da entrada
        run: node --test pc-input-focus.test.mjs
      - name: Instalar navegador WebGL
        run: |
          npm install --prefix tools/visual-lab --no-audit --no-fund
          ./tools/visual-lab/node_modules/.bin/playwright install chromium --with-deps --only-shell
      - name: Servir jogo
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/focus-movement.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/mundo-3d-prototype.html -o /dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Reproduzir W preso após perder foco
        run: NODE_PATH=./tools/visual-lab/node_modules node tools/visual-lab/focus-movement-qa.cjs
      - name: Capturas de antes e depois
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: focus-movement-${{ github.run_number }}
          path: visual-lab-results/focus-movement/
          if-no-files-found: warn
          retention-days: 14
