name: Renascimento — navegação, clima, Vale do Despertar e ângulos fixos (QA jogável)
on:
  pull_request:
    paths:
      - 'mundo-3d-prototype.js'
      - 'eldoria-weather.js'
      - 'eldoria-weather3d.js'
      - 'eldoria-rock-collider.js'
      - 'eldoria-valley-landscape.js'
      - 'eldoria-valley-ruin3d.js'
      - 'eldoria-river-banks.js'
      - 'ascension-layout.js'
      - 'ascension-cave3d.js'
      - 'ascension-cave-sdf.js'
      - 'ascension-cave-sdf.worker.js'
      - 'tests/caverna-c2.test.mjs'
      - 'ascension-cave-look.js'
      - 'tests/caverna-c3.test.mjs'
      - 'ascension-cave-light.js'
      - 'tests/caverna-c4.test.mjs'
      - 'ascension-serra-cleft3d.js'
      - 'tests/caverna-c5.test.mjs'
      - 'eldoria-meshy-npcs.js'
      - 'eldoria-npc-life.js'
      - 'tests/npcs-vivos.test.mjs'
      - 'tests/vila-solida.test.mjs'
      - 'eldoria-village-solids.js'
      - 'eldoria-village-talk.js'
      - 'eldoria-city-plaza.js'
      - 'eldoria-city-plaza3d.js'
      - 'eldoria-city-facades.js'
      - 'eldoria-city-facades3d.js'
      - 'tests/renascimento-f2-fachadas.test.mjs'
      - 'tests/renascimento-f2-cidade.test.mjs'
      - 'eldoria-river-banks3d.js'
      - 'eldoria-water.js'
      - 'tests/renascimento-f2-rio.test.mjs'
      - 'act1-world-layout.js'
      - 'tests/renascimento-f2.test.mjs'
      - 'tests/renascimento-f1.test.mjs'
      - 'tools/visual-lab/renascimento-f1-qa.cjs'
      - '.github/workflows/renascimento-f1-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Testes do Renascimento F1 e regressões vizinhas
        run: node --test tests/renascimento-f1.test.mjs tests/renascimento-f2.test.mjs tests/renascimento-f2-rio.test.mjs tests/renascimento-f2-cidade.test.mjs tests/renascimento-f2-fachadas.test.mjs tests/caverna-c1.test.mjs tests/caverna-c2.test.mjs tests/caverna-c3.test.mjs tests/caverna-c4.test.mjs tests/caverna-c5.test.mjs tests/npcs-vivos.test.mjs tests/vila-solida.test.mjs graphics-adaptive.test.mjs tests/mod317-prologo.test.mjs eldoria-mod291.test.mjs map3d.test.mjs
      - name: Instalar navegador WebGL
        run: |
          npm install --prefix tools/visual-lab --no-audit --no-fund
          ./tools/visual-lab/node_modules/.bin/playwright install chromium --only-shell
      - name: Preparar baseline da base da PR para A/B das clareiras
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch origin "$BASE_SHA" --depth=1
          git worktree add --detach /tmp/renascimento-baseline "$BASE_SHA"
          python3 -m http.server 4174 --bind 127.0.0.1 --directory /tmp/renascimento-baseline >/tmp/ren-base.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4174/mundo-3d-prototype.html -o /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/ren-base.log
          exit 1
      - name: Servir o jogo de teste sem publicar
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/ren.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4173/mundo-3d-prototype.html -o /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/ren.log
          exit 1
      - name: QA jogável em paisagem mobile e desktop (SwiftShader, não Android)
        env:
          VISUAL_BASE_URL: http://127.0.0.1:4173
          VISUAL_BASELINE_URL: ${{ github.event_name == 'pull_request' && 'http://127.0.0.1:4174' || '' }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: NODE_PATH=./tools/visual-lab/node_modules node tools/visual-lab/renascimento-f1-qa.cjs
      - name: Publicar evidências
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: renascimento-f1-${{ github.run_number }}
          path: visual-lab-results/renascimento-f1/
          retention-days: 30
          if-no-files-found: warn
