name: QA direcionado A5 — regressão de missões
on:
  pull_request:
    paths:
      - 'sidequests3d.js'
      - 'sidequests3d.test.mjs'
      - 'map3d.js'
      - 'map3d.test.mjs'
      - 'mundo-3d-prototype.js'
      - 'tests/a5-save-coins-finite.test.mjs'
      - 'act1-flow.js'
      - 'act2-flow.js'
      - 'act1-flow.test.mjs'
      - 'act2-flow.test.mjs'
      - '.github/workflows/qa-a5-save-campaign.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regressao:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar sintaxe dos módulos
        run: node --check sidequests3d.js && node --check act1-flow.js && node --check act2-flow.js && node --input-type=module --check < mundo-3d-prototype.js
      - name: Executar regressões de missões, mapa e campanha
        run: node --test sidequests3d.test.mjs map3d.test.mjs tests/a5-save-coins-finite.test.mjs act1-flow.test.mjs act2-flow.test.mjs
