name: QA direcionado A5 — regressão de missões
on:
  pull_request:
    paths:
      - 'sidequests3d.js'
      - 'sidequests3d.test.mjs'
      - 'map3d.js'
      - 'map3d.test.mjs'
      - 'mundo-3d-prototype.js'
      - 'tools/qa/a5-waystone-gameplay.cjs'
      - 'tools/qa/a5-waystone-qa-utils.cjs'
      - 'tools/qa/a5-waystone-qa-utils.test.cjs'
      - 'tests/a5-save-coins-finite.test.mjs'
      - 'act1-flow.js'
      - 'act2-flow.js'
      - 'act1-flow.test.mjs'
      - 'act2-flow.test.mjs'
      - '.github/workflows/qa-a5-save-campaign.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regressao:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar sintaxe dos módulos
        run: node --check sidequests3d.js && node --check act1-flow.js && node --check act2-flow.js && node --check tools/qa/a5-waystone-gameplay.cjs && node --check tools/qa/a5-waystone-qa-utils.cjs && node --input-type=module --check < mundo-3d-prototype.js
      - name: Executar regressões de missões, mapa e campanha
        run: node --test sidequests3d.test.mjs map3d.test.mjs tests/a5-save-coins-finite.test.mjs act1-flow.test.mjs act2-flow.test.mjs tools/qa/a5-waystone-qa-utils.test.cjs
      - name: Instalar Chromium e Three para QA de gameplay
        run: |
          npm install --prefix work/qa --no-package-lock --ignore-scripts playwright@1.56.1 three@0.160.0
          work/qa/node_modules/.bin/playwright install --with-deps chromium
      - name: Caminhada e registro real dos três abrigos
        env:
          NODE_PATH: ${{ github.workspace }}/work/qa/node_modules
          VISUAL_OUTPUT: ${{ github.workspace }}/work/a5-waystones
          VISUAL_BASE_URL: 'http://127.0.0.1:4173'
        run: |
          python3 -m http.server 4173 --directory "$GITHUB_WORKSPACE" > /tmp/a5-world.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:4173/mundo-3d-prototype.html" >/dev/null; then break; fi
            sleep 1
          done
          node tools/qa/a5-waystone-gameplay.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a5-waystone-gameplay-${{ github.sha }}
          path: work/a5-waystones/
          retention-days: 14
