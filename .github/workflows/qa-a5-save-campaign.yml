name: QA direcionado A5 — regressão de produção e gameplay
on:
  pull_request:
    paths:
      - 'tests/a5-save-coins-finite.test.mjs'
      - 'act1-flow.js'
      - 'act2-flow.js'
      - 'act1-flow.test.mjs'
      - 'act2-flow.test.mjs'
      - 'sidequests3d.js'
      - 'sidequests3d.test.mjs'
      - 'map3d.js'
      - 'map3d.test.mjs'
      - 'tests/a5-vendor-rescue-actual.test.mjs'
      - 'tests/vila-solida.test.mjs'
      - 'mundo-3d-prototype.js'
      - 'mundo-3d-prototype.html'
      - 'mod181-loader.js'
      - 'tools/visual-lab/package.json'
      - 'tools/visual-lab/a5-sidequest-gameplay.cjs'
      - '.github/workflows/qa-a5-save-campaign.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regressao:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar sintaxe do runtime e do QA
        run: node --check act1-flow.js && node --check act2-flow.js && node --check sidequests3d.js && node --check mundo-3d-prototype.js && node --check tools/visual-lab/a5-sidequest-gameplay.cjs
      - name: Executar regressão das missões e integração dos vendedores
        run: node --test sidequests3d.test.mjs tests/a5-vendor-rescue-actual.test.mjs tests/vila-solida.test.mjs
      - name: Executar teste específico e contrato base
        run: node --test tests/a5-save-coins-finite.test.mjs act1-flow.test.mjs act2-flow.test.mjs map3d.test.mjs
      - name: Instalar Chromium para gameplay real
        run: |
          npm install --prefix tools/visual-lab --no-audit --no-fund
          tools/visual-lab/node_modules/.bin/playwright install --with-deps chromium
      - name: Executar jornada jogável das três missões
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/a5-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4173/mundo-3d-prototype.html >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4173/mundo-3d-prototype.html >/dev/null
          VISUAL_BASE_URL=http://127.0.0.1:4173 VISUAL_OUTPUT=visual-lab-results/a5-sidequests node tools/visual-lab/a5-sidequest-gameplay.cjs
      - name: Publicar evidências A5
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a5-sidequest-gameplay-${{ github.sha }}
          path: visual-lab-results/a5-sidequests/
          if-no-files-found: warn
          retention-days: 7
