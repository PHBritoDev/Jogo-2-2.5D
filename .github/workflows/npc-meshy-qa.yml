name: NPC Meshy — auditoria individual em fotos
on:
  pull_request:
    paths:
      - 'eldoria-meshy-npcs.js'
      - 'npc-visual-qa.html'
      - 'tools/visual-lab/npc-meshy-qa.cjs'
      - '.github/workflows/npc-meshy-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fotografar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --prefix tools/visual-lab --no-package-lock --no-audit --no-fund playwright@1.56.1
          tools/visual-lab/node_modules/.bin/playwright install --with-deps chromium
      - run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/npc-meshy.log 2>&1 &
          sleep 2
          NODE_PATH=tools/visual-lab/node_modules node tools/visual-lab/npc-meshy-qa.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: npc-meshy-qa
          path: work/npc-meshy-qa/
          retention-days: 14
