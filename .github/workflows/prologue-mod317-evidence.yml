name: Mod 317 — prólogo jogável, Eldória viva e abrigos (evidências)
on:
  pull_request:
    paths:
      - 'mundo-3d-prototype.js'
      - 'prologue-flow.js'
      - 'prologue-road-flow.js'
      - 'act1-world-layout.js'
      - 'bandit-squad3d.js'
      - 'enemy1-squad3d.js'
      - 'seated-pose3d.js'
      - 'eldoria-shelter3d.js'
      - 'eldoria-meshy-npcs.js'
      - 'map3d.js'
      - 'tests/mod317-prologo.test.mjs'
      - 'tools/visual-lab/prologue-mod317-evidence.cjs'
      - '.github/workflows/prologue-mod317-evidence.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Testes do Mod 317 e regressões do prólogo
        run: node --test tests/mod317-prologo.test.mjs prologue-flow.test.mjs eldoria-mod291.test.mjs enemy1-squad.test.mjs map3d.test.mjs sidequests3d.test.mjs tests/prota-combat302.test.mjs build-info.test.mjs
      - name: Instalar navegador WebGL
        run: |
          npm install --prefix tools/visual-lab --no-audit --no-fund
          ./tools/visual-lab/node_modules/.bin/playwright install chromium --only-shell
      - name: Servir o jogo de teste sem publicar
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/mod317.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4173/mundo-3d-prototype.html -o /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/mod317.log
          exit 1
      - name: Percurso céu → Eldória em paisagem mobile e desktop (SwiftShader, não Android)
        run: NODE_PATH=./tools/visual-lab/node_modules node tools/visual-lab/prologue-mod317-evidence.cjs
      - name: Publicar evidências
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prologue-mod317-${{ github.run_number }}
          path: visual-lab-results/prologue-mod317/
          retention-days: 30
          if-no-files-found: warn
