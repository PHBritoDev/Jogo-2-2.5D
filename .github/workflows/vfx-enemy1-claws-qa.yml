name: VFX Enemy1 — garras QA WebGL
on:
  pull_request:
    paths:
      - 'enemy1-dark-vfx3d.js'
      - 'vfx-enemy1-claws-qa.html'
      - 'tools/visual-lab/vfx-enemy1-claws-qa.cjs'
      - '.github/workflows/vfx-enemy1-claws-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --prefix tools/visual-lab --no-package-lock --no-audit --no-fund playwright@1.56.1
          tools/visual-lab/node_modules/.bin/playwright install --with-deps chromium
      - run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/qa-claws.log 2>&1 &
          sleep 2
          NODE_PATH=tools/visual-lab/node_modules node tools/visual-lab/vfx-enemy1-claws-qa.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vfx-enemy1-claws-qa
          path: work/vfx-enemy1-claws-qa/
          retention-days: 14
