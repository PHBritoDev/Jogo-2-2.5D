name: Comparação visual da Ganância
on:
  workflow_dispatch:
    inputs:
      tested_sha:
        required: true
        type: string
permissions:
  contents: read
jobs:
  comparar:
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    env:
      TARGET: ${{ inputs.tested_sha }}
      BASE: 36ae737d21130619767f1cf0a2e3bffee1ff242a
      GAME_URL: http://127.0.0.1:4173/
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tested_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Ambiente
        run: |
          test "$(git rev-parse HEAD)" = "$TARGET"
          cp tools/qa/greed-framing.cjs "$RUNNER_TEMP/"
          npm install --prefix "$RUNNER_TEMP/gananciadeps" playwright@1.64.1 three@0.160.0 --no-audit --no-fund
          "$RUNNER_TEMP/gananciadeps/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/gananciadeps/node_modules" >> "$GITHUB_ENV"
          echo "THREE_ROOT=$RUNNER_TEMP/gananciadeps/node_modules/three" >> "$GITHUB_ENV"
          python3 -m http.server 4173 --bind 127.0.0.1 > "$RUNNER_TEMP/http.log" 2>&1 &
      - name: Antes e depois no jogo
        run: |
          git checkout --detach "$BASE"
          QA_OUTPUT="$RUNNER_TEMP/provas/antes" node "$RUNNER_TEMP/greed-framing.cjs"
          git checkout --detach "$TARGET"
          QA_OUTPUT="$RUNNER_TEMP/provas/depois" node "$RUNNER_TEMP/greed-framing.cjs"
      - name: Regressão de campanha e chefes
        run: node --test act6-flow.test.mjs dimensions3d.test.mjs finale-flow.test.mjs powers3d.test.mjs ultimates3d.test.mjs
      - name: Geometria e três fases da campanha
        run: |
          node tools/qa/greed-anatomy.cjs
          node tools/qa/greed-campaign.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ganancia-${{ inputs.tested_sha }}
          path: ${{ runner.temp }}/provas/
          retention-days: 14
