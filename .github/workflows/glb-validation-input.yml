name: GLB validation input snapshot
on:
  push:
    branches: ['codex/glb-lossless-2026-11-12']
    paths: ['.github/workflows/glb-validation-input.yml']
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: glb-validation-input
          path: |
            AsasAnjo_leve.glb
            *.js
            *.html
            *.css
            experiments/aerial-combat/*.js
          retention-days: 2
