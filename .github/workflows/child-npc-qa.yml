name: Criança NPC — carregar no mundo real
on:
  pull_request:
    paths:
      - 'mundo-3d-prototype.js'
      - 'tools/visual-lab/child-npc-qa.cjs'
      - '.github/workflows/child-npc-qa.yml'
permissions:
  contents: read
jobs:
  child:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node --input-type=module --check < mundo-3d-prototype.js
          npm install --prefix work/child-npc-deps --no-package-lock --ignore-scripts playwright@1.56.1
          work/child-npc-deps/node_modules/.bin/playwright install --with-deps chromium
      - name: Abrir Eldória e verificar NPC em Chromium WebGL real
        env:
          NODE_PATH: '${{ github.workspace }}/work/child-npc-deps/node_modules'
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/child-http.log 2>&1 &
          node tools/visual-lab/child-npc-qa.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crianca-npc-integracao
          path: work/child-npc-evidence
          retention-days: 14
