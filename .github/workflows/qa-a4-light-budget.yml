name: QA direcionado A4 — regressão de produção
on:
  pull_request:
    paths:
      - 'tests/a4-light-budget-detached.test.mjs'
      - 'light-budget3d.js'
      - '.github/workflows/qa-a4-light-budget.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regressao:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar arquivo JS
        run: node --check light-budget3d.js
      - name: Executar teste específico e contrato base
        run: node --test tests/a4-light-budget-detached.test.mjs
