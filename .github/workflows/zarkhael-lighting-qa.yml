name: A4 — Zar’khael combat lighting A/B
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'zarkhael-dimension3d.js'
      - 'tests/zarkhael-lighting.test.mjs'
      - 'tools/visual-lab/zarkhael-lighting-ab-qa.cjs'
      - '.github/workflows/zarkhael-lighting-qa.yml'
permissions:
  contents: read
jobs:
  zarkhael-lighting:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || 'main' }}
          path: work/baseline
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Domain tests and syntax
        run: |
          node --test dimensions3d.test.mjs zarkhael-dimension.test.mjs tests/zarkhael-lighting.test.mjs
          node --input-type=module --check < zarkhael-dimension3d.js
          node --check tools/visual-lab/zarkhael-lighting-ab-qa.cjs
          node tools/qa/check-ai-onboarding.mjs
          git diff --check
      - name: Install isolated visual QA dependencies
        run: |
          npm install --prefix work/qa --save-exact --no-package-lock --ignore-scripts playwright@1.56.1 three@0.160.0 pngjs@7.0.0
          work/qa/node_modules/.bin/playwright install --with-deps chromium
      - name: Start base and HEAD servers
        run: |
          python3 -m http.server 4173 --directory "$GITHUB_WORKSPACE" > /tmp/zarkhael-head-http.log 2>&1 &
          python3 -m http.server 4174 --directory "$GITHUB_WORKSPACE/work/baseline" > /tmp/zarkhael-base-http.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:4173/mundo-3d-prototype.html >/dev/null && break
            sleep 1
          done
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:4174/mundo-3d-prototype.html >/dev/null && break
            sleep 1
          done
      - name: Capture production arena preview
        env:
          NODE_PATH: ${{ github.workspace }}/work/qa/node_modules
          VISUAL_BASE_URL: http://127.0.0.1:4173
          VISUAL_OUTPUT: ${{ github.workspace }}/work/evidence/preview
        run: node tools/visual-lab/bispo3-dimension-qa.cjs
      - name: Compare base and HEAD in real gameplay
        env:
          NODE_PATH: ${{ github.workspace }}/work/qa/node_modules
          VISUAL_BASELINE_URL: http://127.0.0.1:4174
          VISUAL_BASE_URL: http://127.0.0.1:4173
          VISUAL_OUTPUT: ${{ github.workspace }}/work/evidence/ab
        run: node tools/visual-lab/zarkhael-lighting-ab-qa.cjs
      - name: Regressions in the full combat runtime
        env:
          NODE_PATH: ${{ github.workspace }}/work/qa/node_modules
          VISUAL_BASE_URL: http://127.0.0.1:4173
          VISUAL_OUTPUT: ${{ github.workspace }}/work/evidence/runtime
        run: node tools/visual-lab/bispo3-runtime-qa.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a4-zarkhael-lighting-${{ github.sha }}
          path: work/evidence/
          retention-days: 14
