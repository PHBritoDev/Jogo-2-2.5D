name: Integracao do build central
on:
  pull_request:
    paths:
      - 'build-info.js'
      - 'build-info.test.mjs'
      - 'index.html'
      - 'mundo-3d-prototype.html'
      - 'mundo-3d-prototype.js'
      - 'mod181-loader.js'
      - 'laboratorio-inimigos.html'
      - 'eldoria-mod291.test.mjs'
      - '.github/workflows/build-info-integration.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Sintaxe
        run: |
          node --check build-info.js
          node --check mod181-loader.js
          node --check mundo-3d-prototype.js
          node --test build-info.test.mjs eldoria-mod291.test.mjs eldoria-mod292.test.mjs dimensions3d.test.mjs zarkhael-dimension.test.mjs
      - name: Contrato de integracao
        run: |
          node tools/qa/check-ai-onboarding.mjs
          git diff --check HEAD^ HEAD || true
