name: A1 — testes unitários do percurso de Eldória

on:
  pull_request:
    paths:
      - '.github/workflows/a1-route-qa-unit.yml'
      - '.github/workflows/a1-eldoria-route-capture.yml'
      - '.github/workflows/agente-cenas.yml'
      - 'tools/visual-lab/agent-qa.cjs'
      - 'tools/visual-lab/agent-qa.test.cjs'
      - 'tools/visual-lab/scene-agent.cjs'
      - 'tools/visual-lab/scene-capture-core.cjs'
      - 'tools/visual-lab/scene-capture-core.test.cjs'
      - 'tools/visual-lab/photographer.cjs'
      - 'tools/visual-lab/camera-tree-fade.test.cjs'
      - 'mundo-3d-prototype.js'
      - 'mundo-3d-prototype.html'
      - 'mod181-loader.js'
      - 'build-info.js'
      - 'tools/visual-lab/world-module-loader.test.cjs'
      - 'camera-water-clearance3d.js'
      - 'eldoria-live-village3d.js'
      - 'tests/camera-water-clearance.test.mjs'

permissions:
  contents: read

concurrency:
  group: a1-route-qa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  route-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout SHA exato da PR
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sintaxe do mundo e do módulo de câmera
        run: |
          node --input-type=module --check < mundo-3d-prototype.js
          node --input-type=module --check < camera-water-clearance3d.js
      - name: Testes do agente de cenas
        run: node --test tools/visual-lab/agent-qa.test.cjs tools/visual-lab/scene-capture-core.test.cjs tools/visual-lab/photographer.test.cjs tools/visual-lab/camera-tree-fade.test.cjs tools/visual-lab/world-module-loader.test.cjs tests/camera-water-clearance.test.mjs
