name: Campo Dourado do Bispo 1 — QA WebGL
on:
  workflow_dispatch:
  push:
    branches: [main, feature/bishop1-wind-sunset-slope-v2]
    paths:
      - 'bishop1-golden-meadow3d.js'
      - 'dimension-arenas3d.js'
      - 'dimensions3d.js'
      - 'tools/qa/valerio-visual.cjs'
      - '.github/workflows/valerio-visual.yml'
permissions:
  contents: read
jobs:
  visual:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Sintaxe e contrato de dimensões
        run: |
          node --check bishop1-golden-meadow3d.js
          node --check dimension-arenas3d.js
          node --test dimensions3d.test.mjs
      - name: Agente Playwright isolado
        run: |
          npm install --prefix tools/visual-lab --no-audit --no-fund
          ./tools/visual-lab/node_modules/.bin/playwright install --with-deps chromium
      - name: Capturar telas reais WebGL da dimensão I
        env:
          VISUAL_BASE_URL: http://127.0.0.1:4173
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/bishop1-http.log 2>&1 &
          PID=$!
          trap 'kill "$PID"' EXIT
          node tools/qa/valerio-visual.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bishop1-capturas
          path: valerio-qa-results/
          retention-days: 14
