name: Compactar CriancaNpc sem perder animações
on:
  push:
    branches:
      - 'fix/crianca-npc-asset-optimization'
    paths:
      - '.github/workflows/optimize-crianca-npc.yml'
      - 'tools/qa/check_child_npc_optimized.py'
permissions:
  contents: write
jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install GLB optimizer
        run: npm install --prefix work/optimize-deps --no-package-lock --no-audit --no-fund @gltf-transform/cli@4.5.1
      - name: Preserve geometry and skin, reduce image size, losslessly resample duplicate keyframes
        run: |
          work/optimize-deps/node_modules/.bin/gltf-transform optimize CriancaNpc.glb CriancaNpc-otimizado.glb --compress false --texture-compress auto --texture-size 1024 --flatten false --join false --weld false --resample true --prune false
          python3 tools/qa/check_child_npc_optimized.py CriancaNpc.glb CriancaNpc-otimizado.glb
      - name: Push optimized asset to isolated branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CriancaNpc-otimizado.glb
          git commit -m "asset(child): optimized animation-preserving 1K GLB"
          git push origin HEAD:refs/heads/fix/crianca-npc-asset-optimization
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crianca-npc-optimized
          path: |
            CriancaNpc-otimizado.glb
            child-npc-optimization-report.json
          retention-days: 14
