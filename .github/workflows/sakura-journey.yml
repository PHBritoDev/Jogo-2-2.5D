name: Jornada de Invernália · gameplay
on:
  push:
    branches: ['codex/ato3-travessia-sakura-mod355']
    paths:
      - 'sakura-*.js'
      - 'sakura-*.test.mjs'
      - 'tools/qa/sakura-gameplay.cjs'
      - '.github/workflows/sakura-journey.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sakura-journey-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  gameplay:
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        include:
          - {mode: desktop, tier: high}
          - {mode: mobile, tier: medium}
          - {mode: portrait, tier: low}
          - {mode: survey, tier: low}
          - {mode: walk, tier: low}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Ferramentas de captura
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1 three@0.160.0
          npx playwright install --with-deps chromium
      - name: Regressão de mapas, jornada e campanha
        run: node --test sakura-route3d.test.mjs map3d.test.mjs act1-flow.test.mjs act2-flow.test.mjs act3-flow.test.mjs tests/jornada-mod*.test.mjs
      - name: Percorrer e gravar o jogo
        env:
          OUT: evidence
          GRAPHICS: ${{ matrix.tier }}
        run: |
          mkdir -p evidence
          git rev-parse HEAD > evidence/commit.txt
          python3 -m http.server 4432 --bind 127.0.0.1 > /tmp/sakura-http.log 2>&1 &
          node tools/qa/sakura-gameplay.cjs "${{ matrix.mode }}"
      - name: Pranchas dos quadros capturados
        if: always()
        shell: python
        run: |
          import base64, io, pathlib
          from PIL import Image, ImageDraw
          pics = sorted(pathlib.Path("evidence").glob("*.jpg"))
          for start in range(0, len(pics), 4):
              sheet = Image.new("RGB", (720, 464), "#192025")
              draw = ImageDraw.Draw(sheet)
              for i, pic in enumerate(pics[start:start+4]):
                  with Image.open(pic) as frame:
                      frame.thumbnail((356, 204))
                      x, y = i % 2 * 360, i // 2 * 232
                      sheet.paste(frame, (x+(360-frame.width)//2, y))
                      draw.text((x+5, y+206), pic.stem, fill="white")
              dest = pathlib.Path("evidence") / f"prancha-{start//4}.jpg"
              sheet.save(dest, quality=76)
              print("SAKURA_FRAME", dest.name, base64.b64encode(dest.read_bytes()).decode())
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: invernalia-${{ matrix.mode }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: evidence/
          retention-days: 14
