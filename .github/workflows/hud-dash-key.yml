name: QA HUD — tecla real do DASH
on:
  pull_request:
    paths:
      - 'hud3d.css'
      - 'hud-dash-key.test.mjs'
      - 'tools/visual-lab/dash-key-audit.cjs'
      - '.github/workflows/hud-dash-key.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  hud-key:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Testar atalho DASH
        run: node --test hud-dash-key.test.mjs
      - name: Preparar navegador
        run: |
          npm install --prefix tools/visual-lab --no-audit --no-fund
          ./tools/visual-lab/node_modules/.bin/playwright install chromium --with-deps --only-shell
      - name: Servir jogo 3D
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/hud-dash.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/mundo-3d-prototype.html -o /dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Confirmar tecla F e fotografar HUD real
        run: NODE_PATH=./tools/visual-lab/node_modules node tools/visual-lab/dash-key-audit.cjs
      - name: Guardar capturas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dash-key-${{ github.run_number }}
          path: visual-lab-results/dash-key/
          retention-days: 14
          if-no-files-found: warn
