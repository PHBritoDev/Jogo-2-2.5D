name: VFX Dash — auditoria visual isolada
on:
  pull_request:
    paths:
      - 'prota-vfx3d.js'
      - 'vfx-dash-qa.html'
      - 'tools/visual-lab/vfx-dash-qa.cjs'
      - '.github/workflows/vfx-dash-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --prefix tools/visual-lab --no-audit --no-fund --no-package-lock playwright@1.56.1
          tools/visual-lab/node_modules/.bin/playwright install --with-deps chromium
      - run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/vfx-http.log 2>&1 &
          sleep 2
          NODE_PATH=tools/visual-lab/node_modules node tools/visual-lab/vfx-dash-qa.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vfx-dash-qa-${{ github.run_number }}
          path: work/vfx-dash-evidence/
          retention-days: 14
