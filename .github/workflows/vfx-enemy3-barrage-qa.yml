name: VFX Enemy3 Barragem — QA WebGL
on:
  pull_request:
    paths:
      - 'enemy3-abyss-vfx3d.js'
      - 'vfx-enemy3-barrage-qa.html'
      - 'tools/visual-lab/vfx-enemy3-barrage-qa.cjs'
      - '.github/workflows/vfx-enemy3-barrage-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --prefix tools/visual-lab --no-package-lock --no-audit --no-fund playwright@1.56.1
          tools/visual-lab/node_modules/.bin/playwright install --with-deps chromium
      - run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/qa-barrage.log 2>&1 &
          sleep 2
          NODE_PATH=tools/visual-lab/node_modules node tools/visual-lab/vfx-enemy3-barrage-qa.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vfx-enemy3-barrage-qa
          path: work/vfx-enemy3-barrage-qa/
          retention-days: 14
