<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Colapso da Luz Eterna</title><style>body{margin:0;background:#09111e;color:white;font:14px system-ui}header{position:absolute;left:24px;top:20px}button{position:absolute;left:24px;bottom:24px;padding:12px}canvas{display:block}</style><header>JULGAMENTO DIVINO — COLAPSO DA LUZ ETERNA</header><button id="cast">INVOCAR</button><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script><script type="module">
import * as T from 'three';import{CelestialWhiteHole}from'./celestial-whitehole3d.js';import{createWhiteHoleVFX}from'./celestial-whitehole-vfx3d.js';
const scene=new T.Scene();scene.background=new T.Color('#09111e');const camera=new T.PerspectiveCamera(50,innerWidth/innerHeight,.1,500);camera.position.set(7,43,68);camera.lookAt(0,47,0);const renderer=new T.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);document.body.appendChild(renderer.domElement);scene.add(new T.HemisphereLight(0xffffff,0x333333,2));const floor=new T.Mesh(new T.PlaneGeometry(500,500),new T.MeshStandardMaterial({color:0x172122}));floor.rotation.x=-Math.PI/2;scene.add(floor);const hero=new T.Mesh(new T.CapsuleGeometry(.3,1.3,6,12),new T.MeshStandardMaterial({color:0xefddaa}));hero.position.y=25;scene.add(hero);const fx=createWhiteHoleVFX(T,scene),skill=new CelestialWhiteHole(),target={id:1,x:0,y:0,z:-8,alive:true};let freeze=false,quality=2;function start(){skill.cancel();skill.start({x:0,y:0,z:0},target);}function step(dt){skill.update(dt,target);fx.update(skill,camera,quality);renderer.render(scene,camera);}start();document.querySelector('#cast').onclick=start;const clock=new T.Clock();renderer.setAnimationLoop(()=>step(freeze?0:Math.min(.04,clock.getDelta())));window.preview={freeze(){freeze=true},start,step,quality:q=>quality=q,info:()=>({calls:renderer.info.render.calls,triangles:renderer.info.render.triangles,geo:renderer.info.memory.geometries}),state:()=>({time:skill.time,phase:skill.phase})};
</script></html>
