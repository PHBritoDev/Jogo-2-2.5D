<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#05030a">
<title>A Batalha Contra os 7 Pecados Capitais</title>
<style>html,body{margin:0;height:100%;background:#05030a;overflow:hidden}#primary-3d-frame{position:fixed;inset:0;width:100%;height:100%;border:0;background:#05030a}</style>
<style>/* MOD 376: casca visível desde o primeiro byte (nunca tela preta) até o boot do jogo pintar dentro do iframe */
#shell-boot{position:fixed;inset:0;z-index:9998;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;background:radial-gradient(ellipse 70% 60% at 50% 46%,#140a12,#050307 78%);color:#e9d6b2;font-family:Georgia,"Times New Roman",serif;text-align:center;transition:opacity .5s ease,visibility 0s linear .5s;pointer-events:none}
#shell-boot span{font-size:clamp(10px,2.6vw,14px);letter-spacing:.34em;color:#cdb58e}#shell-boot b{font-weight:500;font-size:clamp(24px,7.4vw,44px);letter-spacing:.06em}#shell-boot i{font-style:normal;color:#c8202c;font-size:1.25em}
#shell-boot small{margin-top:14px;font:700 9px/1 system-ui,sans-serif;letter-spacing:.24em;color:#d8c39ca8}#shell-boot.off{opacity:0;visibility:hidden}
/* o atalho de testes só aparece em contexto de QA/admin (?testar=1 lembra no aparelho; ?testar=0 esquece) */
#lab-test-entry{display:none}#lab-test-entry.qa{display:block}</style>
<style>#lab-test-entry.qa{position:fixed;z-index:9999;top:calc(10px + env(safe-area-inset-top));left:10px;padding:10px 15px;border:1px solid #dfbf78;border-radius:12px;background:#152234e8;color:#fff3bf;text-decoration:none;font:800 13px system-ui;box-shadow:0 3px 16px #0009}#lab-test-entry.qa:focus-visible{outline:3px solid #fff}</style>
</head>
<body>
<div id="shell-boot" role="status" aria-label="Carregando"><span>A BATALHA CONTRA OS</span><b><i>7</i> PECADOS CAPITAIS</b><small>CARREGANDO</small></div>
<a id="lab-test-entry" href="./laboratorio-inimigos.html" aria-label="Abrir dimensão de testes dos inimigos">⚔ TESTAR</a>
<script>
/* MOD 202 — o mundo 3D é o jogo inteiro. O antigo mundo 2D foi removido: a dimensão de VHAZRAEL (e as dos outros
   Bispos) agora acontecem dentro do 3D, sem trocar de página. Esta página só hospeda o mundo e repassa os
   parâmetros de depuração/reinício. */
(function(){
  var params=new URLSearchParams(window.location.search);
  if(params.get('resetGalaxy1')==='1'&&!params.has('todasHabilidades')&&!params.has('vfxLab236')&&!params.has('testeQuantum233')){
    try{
      Object.keys(localStorage).forEach(function(key){
        if(/^sevenSins3DCampaignV[1-6]$/.test(key) ||
           (key.indexOf('seven-sins-')===0 && !/^seven-sins-3d-(daynight|fps|graphics|settings)$/.test(key))){
          localStorage.removeItem(key);
        }
      });
    }catch(e){}
    params.delete('resetGalaxy1');
    var cleanUrl=window.location.pathname+(params.toString()?'?'+params.toString():'')+window.location.hash;
    window.history.replaceState({},'',cleanUrl);
  }
  // Atalho TESTAR: só em contexto de QA/admin (parâmetros de teste, automação ou ?testar=1 lembrado neste aparelho).
  try{ if(params.get('testar')==='1')localStorage.setItem('seven-sins-qa-shortcut','1'); if(params.get('testar')==='0')localStorage.removeItem('seven-sins-qa-shortcut'); }catch(e){}
  var qaKeys=['testar','treinoEspadas','todasHabilidades','debug3d','testeDimensao','vfxLab236','testeQuantum233','qa','lab'];
  var qa=navigator.webdriver||qaKeys.some(function(k){return params.has(k)&&params.get(k)!=='0';});
  try{ qa=qa||localStorage.getItem('seven-sins-qa-shortcut')==='1'; }catch(e){}
  if(qa)document.querySelector('#lab-test-entry').classList.add('qa');
  // A casca some quando o boot do jogo pinta (mensagem do iframe) ou, no mínimo, quando o documento do iframe carrega.
  var shellBoot=document.getElementById('shell-boot'),shellOff=function(){shellBoot.classList.add('off');};
  window.addEventListener('message',function(e){if(e.origin===location.origin&&e.data&&e.data.type==='SEVEN_SINS_BOOT_PAINTED')shellOff();});
  var frame=document.createElement('iframe');
  frame.addEventListener('load',shellOff);
  frame.id='primary-3d-frame';
  frame.title='Mundo 3D — A Batalha Contra os 7 Pecados Capitais';
  const lab = new URL('./laboratorio-inimigos.html', location.href);
  lab.search = params.toString();
  document.querySelector('#lab-test-entry').href = lab.href;
  if (params.get('adm') === '1') { location.replace(lab.href); return; }
  frame.allow='fullscreen';
  document.body.appendChild(frame);
  // Metadata único, atualizado sem tocar este shell ou o loader.
  Promise.all([import('./shell-navigation.js'), import('./build-info.js?stamp='+Date.now())])
    .then(([nav,meta])=>{frame.src=nav.worldURL(params,meta.BUILD);})
    .catch(()=>{frame.src='./mundo-3d-prototype.html?'+params;});
})();
</script>
</body>
</html>
