<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#4fa9ec">
<title>Seven Sins - Demo de Exploração</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<canvas id="game"></canvas>

<!-- Interface (HUD) -->
<div id="fps">-- FPS</div>

<div id="top-buttons">
  <button id="btn-fs" class="btn-round" aria-label="Tela cheia">⛶</button>
  <button id="btn-pause" class="btn-round" aria-label="Pausar">❚❚</button>
</div>

<div id="joy-zone"></div>
<div id="joy-base"><div id="joy-knob"></div></div>
<button id="btn-jump" aria-label="Pular">PULAR</button>
<button id="btn-attack" aria-label="Atacar">ATACAR</button>
<button id="btn-defend" aria-label="Defender">DEFENDER</button>
<button id="btn-interact" class="hidden" aria-label="Falar">FALAR</button>

<!-- HUD de combate -->
<div id="hp-bar">
  <div id="hp-trail"></div>
  <div id="hp-fill"></div>
  <span id="hp-text"></span>
</div>
<div id="hurt-flash"></div>
<div id="ko">DERROTADO</div>

<!-- HUD de missão -->
<div id="quest-box" class="hidden">
  <div id="quest-title"></div>
  <div id="quest-obj"></div>
</div>
<div id="coin-box"><span class="coin-ic"></span><span id="coin-n">0</span></div>
<div id="toast"></div>

<!-- Caixa de diálogo -->
<div id="dialog" class="hidden">
  <div id="dlg-who"></div>
  <div id="dlg-text"></div>
  <div id="dlg-choices"></div>
  <div id="dlg-hint">toque para continuar ▶</div>
</div>

<!-- Telas de aviso -->
<div id="overlay-pause" class="overlay hidden">
  <h1>Pausado</h1>
  <button id="btn-resume" class="btn-big">Continuar</button>
</div>

<div id="overlay-rotate" class="overlay hidden">
  <div class="rotate-icon">↻</div>
  <h1>Gire o celular</h1>
  <p>Este jogo funciona na horizontal.</p>
</div>

<!-- Scripts (ordem importa) -->
<script src="config.js"></script>
<script src="utils.js"></script>
<script src="input.js"></script>
<script src="world.js"></script>
<script src="camera.js"></script>
<script src="ambient.js"></script>
<script src="player.js"></script>
<script src="combat.js"></script>
<script src="greed.js"></script>
<script src="quest.js"></script>
<script src="render.js"></script>
<script src="main.js"></script>

</body>
</html>
