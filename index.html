<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#05030a">
<title>A Batalha Contra os 7 Pecados Capitais</title>
<style>html,body{margin:0;height:100%;background:#05030a;overflow:hidden}#primary-3d-frame{position:fixed;inset:0;width:100%;height:100%;border:0;background:#05030a}</style>
<style>#lab-test-entry{position:fixed;z-index:9999;top:calc(10px + env(safe-area-inset-top));left:10px;padding:10px 15px;border:1px solid #dfbf78;border-radius:12px;background:#152234e8;color:#fff3bf;text-decoration:none;font:800 13px system-ui;box-shadow:0 3px 16px #0009}#lab-test-entry:focus-visible{outline:3px solid #fff}</style>
</head>
<body>
<a id="lab-test-entry" href="./laboratorio-inimigos.html" aria-label="Abrir dimensão de testes dos inimigos">⚔ TESTAR</a>
<script>
/* MOD 202 — o mundo 3D é o jogo inteiro. O antigo mundo 2D foi removido: a dimensão de VHAZRAEL (e as dos outros
   Bispos) agora acontecem dentro do 3D, sem trocar de página. Esta página só hospeda o mundo e repassa os
   parâmetros de depuração/reinício. */
(function(){
  var params=new URLSearchParams(window.location.search);
  if(params.get('resetGalaxy1')==='1'&&!params.has('todasHabilidades')&&!params.has('vfxLab236')&&!params.has('testeQuantum233')){
    try{
      Object.keys(localStorage).forEach(function(key){
        if(/^sevenSins3DCampaignV[1-6]$/.test(key) ||
           (key.indexOf('seven-sins-')===0 && !/^seven-sins-3d-(daynight|fps|graphics|settings)$/.test(key))){
          localStorage.removeItem(key);
        }
      });
    }catch(e){}
    params.delete('resetGalaxy1');
    var cleanUrl=window.location.pathname+(params.toString()?'?'+params.toString():'')+window.location.hash;
    window.history.replaceState({},'',cleanUrl);
  }
  var frame=document.createElement('iframe');
  frame.id='primary-3d-frame';
  frame.title='Mundo 3D — A Batalha Contra os 7 Pecados Capitais';
  frame.src='mundo-3d-prototype.html?refresh=251&build=251'+(params.has('todasHabilidades')?'&todasHabilidades=1':'')+(params.has('debug3d')?'&debug3d=1':'')+(params.has('galaxias')?'&galaxias=1':'')+(params.has('treinoEspadas')?'&treinoEspadas=1':'')+(params.has('treinoCombate244')?'&treinoCombate244=1':'')+(params.has('vfxLab236')?'&vfxLab236=1':'')+(params.has('testeQuantum233')?'&testeQuantum233=1':'')+(params.has('testeVhazrael')?'&testeVhazrael=1':'');
  frame.allow='fullscreen';
  document.body.appendChild(frame);
})();
</script>
</body>
</html>
