<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VFX QA — Dash Sombrio</title><style>html,body{margin:0;background:#0b141b;color:white}canvas{display:block;width:100%;height:100%}#label{position:absolute;top:12px;left:16px;font:14px system-ui;background:#07111dcc;padding:8px}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script></head><body><div id="label">Ato 1 • Dash Sombrio — isolamento visual</div><script type="module">
import * as T from 'three';import {createProtaVFX} from './prota-vfx3d.js';
const renderer=new T.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setPixelRatio(1);renderer.setSize(960,540);renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.ACESFilmicToneMapping;document.body.append(renderer.domElement);
const scene=new T.Scene();scene.background=new T.Color('#13202b');const camera=new T.PerspectiveCamera(48,960/540,.01,90);camera.position.set(3.7,2.65,6.4);camera.lookAt(0,.8,0);
scene.add(new T.HemisphereLight(0xa9c8ff,0x152019,2.5));const key=new T.DirectionalLight(0xffd09a,2);key.position.set(2,5,1);scene.add(key);
const floor=new T.Mesh(new T.PlaneGeometry(30,30),new T.MeshStandardMaterial({color:0x374a3b,roughness:.93}));floor.rotation.x=-Math.PI/2;scene.add(floor);
const grid=new T.GridHelper(16,16,0x8a998b,0x546b65);grid.position.y=.005;scene.add(grid);
const g=new T.Group();scene.add(g);const body=new T.Mesh(new T.CapsuleGeometry(.24,.85,4,12),new T.MeshStandardMaterial({color:0x363246,roughness:.73}));body.position.y=.95;g.add(body);const cloak=new T.Mesh(new T.ConeGeometry(.42,1.4,8),new T.MeshStandardMaterial({color:0x16141e,roughness:.94}));cloak.position.y=.8;g.add(cloak);
const vfx=createProtaVFX(T,scene);let elapsed=0;function frame(dt){elapsed+=dt;vfx.update(dt,camera,'high');renderer.render(scene,camera);}
window.qa={ready:true,renderer,vfx,frame,run:(elapsedTime=.12,kind='vanish')=>{vfx.clear();elapsed=0;g.position.x=kind==='reappear'?1.6:0;const p={x:g.position.x,y:0,z:0},dir={x:1,z:0};if(kind==='vanish')vfx.vanish(p,dir);else vfx.reappear(p,dir,3);for(let t=0;t<elapsedTime;t+=1/60)frame(Math.min(1/60,elapsedTime-t));return {stats:vfx.stats(),render:{calls:renderer.info.render.calls,triangles:renderer.info.render.triangles,points:renderer.info.render.points},memory:{geometries:renderer.info.memory.geometries,textures:renderer.info.memory.textures},elapsedTime,kind};}};
frame(0);
</script></body></html>
