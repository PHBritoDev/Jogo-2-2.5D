<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#172a24">
<title>Seven Sins — Protótipo Mundo 3D</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101b1c;color:#fff;font-family:system-ui,-apple-system,Segoe UI,sans-serif;touch-action:none}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}#look-area{position:fixed;inset:0;z-index:0;touch-action:none}#top,#hint,#marker,#back,#stick,#actions{z-index:2}#top,#hint,#marker{pointer-events:none}#back,#stick,#actions{pointer-events:auto}
#top{position:fixed;top:10px;left:10px;right:10px;display:flex;align-items:flex-start;justify-content:space-between;gap:10px;pointer-events:none}
#title{padding:9px 12px;border:1px solid #ffffff35;border-radius:12px;background:#07110c99;backdrop-filter:blur(8px);font-size:12px;letter-spacing:.08em;font-weight:800}
#status{max-width:60%;padding:8px 10px;border-radius:10px;background:#07110c99;font-size:11px;text-align:right;color:#d8eadc}
#marker{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:24px;height:24px;border-radius:50%;border:1px solid #ffffff45;background:#07110c88;display:grid;place-items:center;font-size:11px;font-weight:800;pointer-events:none}
#hint{position:fixed;left:50%;top:54px;transform:translateX(-50%);max-width:92vw;text-align:center;color:#efffe9;background:#07110ca6;border:1px solid #ffffff20;border-radius:10px;padding:7px 10px;font-size:11px;pointer-events:none}
#stick{position:fixed;left:20px;bottom:22px;width:116px;height:116px;border-radius:50%;background:#06130b60;border:1px solid #ffffff50;touch-action:none}
#knob{position:absolute;left:33px;top:33px;width:48px;height:48px;border-radius:50%;background:#d8e8d5b8;border:1px solid #fff8;box-shadow:0 2px 12px #0005}
#actions{position:fixed;right:16px;bottom:22px;display:grid;grid-template-columns:repeat(2,64px);gap:9px}
button{width:64px;height:58px;border-radius:18px;border:1px solid #ffffff50;background:#10251bd9;color:white;font-weight:800;font-size:11px;box-shadow:0 4px 14px #0003;touch-action:manipulation}
button:active{transform:scale(.96);background:#31583d}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:26px;background:linear-gradient(#10251bdc,#08110feF);z-index:5;font-size:14px;line-height:1.6}
#loading.hidden{display:none}
#back{position:fixed;right:10px;top:54px;z-index:2;width:auto;height:auto;padding:7px 10px;border-radius:10px;text-decoration:none;color:#fff;background:#07110c99;border:1px solid #ffffff35;font-size:11px}
@media(min-width:800px){#stick{width:130px;height:130px;left:28px;bottom:28px}#knob{left:39px;top:39px}#actions{right:28px;bottom:28px;grid-template-columns:repeat(4,68px)}button{width:68px}}
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div id="look-area" aria-label="Arraste para olhar para cima/baixo; use dois dedos para aproximar/afastar"></div>
<div id="top"><div id="title">A BATALHA CONTRA OS 7 PECADOS</div><div id="status">Preparando o mundo 3D…</div></div>
<div id="marker" aria-label="Modificação 141">141</div>
<div id="hint">PROTÓTIPO 3D · explore o vale e teste a movimentação</div>
<a id="back" href="./index.html">Voltar ao jogo 2D</a>
<div id="stick" aria-label="Controle de movimento"><div id="knob"></div></div>
<div id="actions">
<button id="attack">GOLPE</button><button id="jump">PULAR</button>
<button id="magic">MAGIA</button><button id="ultimate">ULTIMATE</button>
</div>
<div id="loading">Carregando o protagonista 3D e construindo o vale…<br><br>Esta é uma versão paralela de teste. A campanha original continua intacta.</div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module" src="./mundo-3d-prototype.js?v=mod141-jump-camera-fix"></script>
</body>
</html>
