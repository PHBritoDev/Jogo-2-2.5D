<!doctype html><html><head><meta charset="utf-8"><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script><style>body{margin:0;background:#111}canvas{display:block}</style></head><body><script type="module">
import * as T from 'three';import {createStarfallVFX} from './celestial-starfall-vfx3d.js';
const renderer=new T.WebGLRenderer({antialias:false,preserveDrawingBuffer:true});renderer.setSize(960,540);renderer.setPixelRatio(1);document.body.append(renderer.domElement);
const scene=new T.Scene();scene.background=new T.Color('#17202a');const camera=new T.PerspectiveCamera(55,960/540,.1,200);camera.position.set(12,12,16);camera.lookAt(0,4,0);
const ground=new T.Mesh(new T.PlaneGeometry(80,80),new T.MeshBasicMaterial({color:'#344a42'}));ground.rotation.x=-Math.PI/2;scene.add(ground);scene.add(new T.GridHelper(30,30,0x60746c,0x40584f));
const fx=createStarfallVFX(T,scene,{ground:()=>0});const p=(x,y,z)=>({x,y,z});
window.qa={ready:true,show:(progress=.8)=>{const t=2.4;const s={i:9,heavy:true,phase:'flight',born:t-.65*progress,from:p(-2,9,-2),aim:p(2,0,2),p:p(-2+4*progress,9-9*progress*progress,-2+4*progress),impactAt:-1};const state={active:true,time:t,center:p(0,9,0),launch:p(0,2,0),source:p(0,1,0),stars:[s]};fx.update(state,camera,false);renderer.render(scene,camera);return {progress,calls:renderer.info.render.calls,triangles:renderer.info.render.triangles,geometries:renderer.info.memory.geometries,textures:renderer.info.memory.textures};}};window.qa.show();
</script></body></html>
