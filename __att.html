<!doctype html><html><body style="margin:0;background:#333"><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as T from 'three';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';import {buildCosmicSword} from './vorgazhek-cosmic-sword3d.js';
const q=new URLSearchParams(location.search);const scene=new T.Scene();scene.background=new T.Color(0x556070);const cam=new T.PerspectiveCamera(40,1,.01,100);
const r=new T.WebGLRenderer({antialias:true});r.setSize(400,400);r.outputColorSpace=T.SRGBColorSpace;document.body.appendChild(r.domElement);
scene.add(new T.HemisphereLight(0xffffff,0x444444,2));const d=new T.DirectionalLight(0xffffff,2);d.position.set(2,3,4);scene.add(d);
const b=await new GLTFLoader().loadAsync('/Bispo2-lod.glb');const m=b.scene;scene.add(m);const box=new T.Box3().setFromObject(m);const sc=1.7*1.45/(box.max.y-box.min.y);m.scale.setScalar(sc);m.position.y=-box.min.y*sc;
const mixer=new T.AnimationMixer(m);const clip=b.animations.find(c=>c.name===(q.get('clip')||'Swim Idle'));mixer.clipAction(clip).play();mixer.setTime(+(q.get('t')||0));m.updateMatrixWorld(true);
let rh=null;m.traverse(o=>{if(o.name==='mixamorigRightHand')rh=o;});const ws=rh.getWorldScale(new T.Vector3());
const s=buildCosmicSword(T);const [rx,ry,rz]=(q.get('rot')||'0,0,0').split(',').map(v=>+v*Math.PI/180);const [px,py,pz]=(q.get('pos')||'0,0,0').split(',').map(Number);
s.rotation.set(rx,ry,rz);s.position.set(px/ws.x,py/ws.x,pz/ws.x);s.scale.setScalar(1.15/ws.x);rh.add(s);m.updateMatrixWorld(true);
const hp=rh.getWorldPosition(new T.Vector3());const ang=+(q.get('ang')||0.5);cam.position.set(Math.sin(ang)*7,1.8,Math.cos(ang)*7);cam.lookAt(0,1.5,0);r.render(scene,cam);window.__ready=true;window.__info={ws:ws.x};
</script></body></html>
