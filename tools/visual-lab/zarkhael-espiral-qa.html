<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ZAR'KHAEL — QA da Espiral do Carrasco</title>
<style>html,body{margin:0;background:#0b0910;color:#e6d3ff;font:12px system-ui}#info{position:fixed;left:6px;bottom:4px}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
</head><body><div id="info">…</div>
<script type="module">
/* Missão 20/11 — prova isolada do VFX da Espiral (carga na lâmina → massa helicoidal → impacto), 4 instantes lado a lado. */
import * as THREE from 'three';
import { createZarkhaelSpiralVFX } from '../../zarkhael-spiral-vfx3d.js';
const W = 1200, H = 340, r = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true }); r.setSize(W, H); r.setScissorTest(true); document.body.appendChild(r.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x14111c); const fx = createZarkhaelSpiralVFX(THREE, scene);
const floor = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.MeshBasicMaterial({ color: 0x25212e })); floor.rotation.x = -Math.PI / 2; scene.add(floor);
const cam = new THREE.PerspectiveCamera(45, (W / 4) / H, .05, 80); cam.position.set(4.5, 2.2, 3); cam.lookAt(0, 1.2, -3);
const base = new THREE.Vector3(.3, 1.6, 0), tip = new THREE.Vector3(1.2, 1.3, .2), ref = { x: 0, y: 1.2, z: 0, dx: 0, dz: -1, gy: 0 };
const shots = [['carga', () => { for (let i = 0; i < 40; i++) { const a = i * .25; tip.set(Math.cos(a) * 1.4, 1.3, Math.sin(a) * 1.4); fx.charge(base, tip, i / 40, 1 / 30); fx.update(1 / 30, 1); } }],
  ['liberação', () => { fx.release(ref, tip.clone()); for (let i = 0; i < 4; i++) { ref.z -= 12.5 / 30; fx.update(1 / 30, 1); } }],
  ['voo', () => { for (let i = 0; i < 10; i++) { ref.z -= 12.5 / 30; fx.update(1 / 30, 1); } }],
  ['cúpula', () => { fx.impact(ref, {}); for (let i = 0; i < 6; i++) fx.update(1 / 30, 1); }]];
shots.forEach(([n, f], i) => { f(); const x = i * W / 4; r.setViewport(x, 0, W / 4, H); r.setScissor(x, 0, W / 4, H); r.render(scene, cam); });
document.getElementById('info').textContent = shots.map(s => s[0]).join(' · ') + ' | ' + JSON.stringify(fx.stats()); window.__done = true;
</script></body></html>
