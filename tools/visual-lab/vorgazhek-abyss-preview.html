<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vorgazhek — Abyss QA</title>
<style>html,body{margin:0;background:#000;color:#eee;font:12px monospace}canvas{display:block}aside{position:fixed;top:5px;left:7px;pointer-events:none}</style><aside id="info">Aguardando WebGL</aside>
<script type="importmap">{"imports":{"three":"https://esm.sh/three@0.160.0"}}</script>
<script type="module">
import * as THREE from 'three';
import {buildDimensionArena} from '../../dimension-arenas3d.js';
const scene=new THREE.Scene(),renderer=new THREE.WebGLRenderer({antialias:false,preserveDrawingBuffer:true,powerPreference:'high-performance'});
renderer.setPixelRatio(1);renderer.setSize(innerWidth,innerHeight);renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.12;document.body.append(renderer.domElement);
const cam=new THREE.PerspectiveCamera(62,innerWidth/innerHeight,.1,600);
const ambient=new THREE.HemisphereLight(0xa6a6b1,0x020203,1.5);scene.add(ambient);
const light=new THREE.PointLight(0xdadce6,35,180);light.position.set(0,23,0);scene.add(light);
const spec={x:0,y:0,z:0,radius:85},arena=buildDimensionArena(THREE,'eyes',spec);arena.group.visible=true;scene.add(arena.group);
const hero=new THREE.Mesh(new THREE.CapsuleGeometry(.65,2.3,4,10),new THREE.MeshStandardMaterial({color:0xdddddd,roughness:.55}));hero.position.set(0,1.9,12);scene.add(hero);
const boss=new THREE.Mesh(new THREE.CapsuleGeometry(1.1,3.9,4,14),new THREE.MeshStandardMaterial({color:0x48151a,emissive:0x260004,emissiveIntensity:.6}));boss.position.set(0,2.7,-6);scene.add(boss);
function frame(ms=2000){const t=ms*.001;cam.updateProjectionMatrix();arena.update(ms,cam,innerHeight,{playerPosition:hero.position});renderer.render(scene,cam);return {calls:renderer.info.render.calls,triangles:renderer.info.render.triangles,geometries:renderer.info.memory.geometries,textures:renderer.info.memory.textures};}
function camera(which='wide'){if(which==='close'){cam.position.set(8,6,36);cam.lookAt(-13,15,-92);}else if(which==='side'){cam.position.set(40,5,10);cam.lookAt(0,8,-30);}else if(which==='far'){cam.position.set(0,12,72);cam.lookAt(0,6,-30);}else{cam.position.set(0,7,31);cam.lookAt(0,4,-22);}return frame();}
function rebuild(){scene.remove(arena.group);arena.dispose();}
window.abyssQA={scene,renderer,arena,cam,hero,boss,frame,camera,rebuild};window.ready=true;camera('wide');document.querySelector('#info').textContent='Dimensão II — QA';
</script></html>
