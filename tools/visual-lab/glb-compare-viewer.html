<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Visual QA GLB</title><style>body{margin:0;background:#25262a;overflow:hidden}</style></head><body>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
const params=new URLSearchParams(location.search);const src=params.get('src');
window.glbVisualQA={ready:false,error:null,src};
const scene=new THREE.Scene();scene.background=new THREE.Color(0x34383d);
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});
renderer.setPixelRatio(1);renderer.setSize(800,800);renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.25;
document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0x5a5a69,2.4));
const key=new THREE.DirectionalLight(0xffeedd,3);key.position.set(5,8,6);scene.add(key);
const fill=new THREE.DirectionalLight(0xcbd6ff,1.3);fill.position.set(-5,3,-5);scene.add(fill);
const camera=new THREE.PerspectiveCamera(36,1,0.01,2000);
new GLTFLoader().load(src,gltf=>{
 const model=gltf.scene;scene.add(model);model.updateMatrixWorld(true);
 const bounds=new THREE.Box3().setFromObject(model);if(bounds.isEmpty())throw Error('empty model');
 const center=bounds.getCenter(new THREE.Vector3()),size=bounds.getSize(new THREE.Vector3());
 const rad=Math.max(size.x,size.y,size.z,0.01);
 camera.position.copy(center).add(new THREE.Vector3(rad*1.5,rad*.7,rad*2.2));
 camera.lookAt(center);camera.near=Math.max(.001,rad*.001);camera.far=Math.max(10,rad*30);camera.updateProjectionMatrix();
 renderer.render(scene,camera);
 let meshes=0;model.traverse(o=>{if(o.isMesh)meshes++;});
 Object.assign(window.glbVisualQA,{ready:true,meshes,bounds:{x:size.x,y:size.y,z:size.z},animations:gltf.animations.length});
},undefined,e=>{window.glbVisualQA.error=String(e?.message||e)});
</script></body></html>
