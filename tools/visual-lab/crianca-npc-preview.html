<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>html,body{margin:0;overflow:hidden;background:#10171c} canvas{display:block}</style><script type="importmap">{"imports":{"three":"https://esm.sh/three@0.160.0","three/addons/":"https://esm.sh/three@0.160.0/examples/jsm/"}}</script></head><body><script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x1a2430);
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setPixelRatio(1);renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.25;renderer.shadowMap.enabled=true;document.body.append(renderer.domElement);
const cam=new THREE.PerspectiveCamera(34,innerWidth/innerHeight,.05,200);scene.add(new THREE.HemisphereLight(0xeaf0ff,0x34434b,2.1));
function light(color,intensity,x,y,z){const a=new THREE.DirectionalLight(color,intensity);a.position.set(x,y,z);scene.add(a);}
light(0xffffff,3,4,9,7);light(0x9bbbe6,1.3,-5,6,-7);
const ground=new THREE.Mesh(new THREE.CircleGeometry(5,64),new THREE.MeshStandardMaterial({color:0x303b48,roughness:1}));ground.rotation.x=-Math.PI/2;scene.add(ground);
const loader=new GLTFLoader();window.ready=false;window.modelReport={};
try {
 const gltf=await loader.loadAsync('../../CriancaNpc.glb');
 const root=gltf.scene;scene.add(root);
 const box=new THREE.Box3().setFromObject(root);
 if(box.isEmpty())throw Error('GLB has no bounds');
 const size=box.getSize(new THREE.Vector3()),center=box.getCenter(new THREE.Vector3());
 root.position.sub(center);root.position.y+=size.y/2;
 ground.position.y=-.045;
 const span=Math.max(size.y, size.x*1.6,size.z*1.6),dist=span/(2*Math.tan(THREE.MathUtils.degToRad(cam.fov/2)))*1.35;
 cam.position.set(span*.12,span*.58,dist);cam.lookAt(0,span*.48,0);
 const mixer=gltf.animations.length?new THREE.AnimationMixer(root):null;
 if(mixer&&gltf.animations[0]) {mixer.clipAction(gltf.animations[0]).play();mixer.update(.04);}
 window.modelReport={animations:gltf.animations.map(a=>a.name),meshes:0,triangles:0,size:size.toArray(),skins:0,materials:[]};
 root.traverse(o=>{if(o.isMesh){window.modelReport.meshes++;if(o.isSkinnedMesh)window.modelReport.skins++;const p=o.geometry?.index?.count??o.geometry?.attributes.position?.count??0;window.modelReport.triangles+=Math.round(p/3);const m=[].concat(o.material||[]);for(const mat of m)if(mat&&!window.modelReport.materials.includes(mat.name))window.modelReport.materials.push(mat.name);}});
 function pose(yaw=0){root.rotation.y=yaw;renderer.render(scene,cam);return window.modelReport;}
 window.preview={pose,root,cam,renderer,scene};pose();window.ready=true;
} catch(e){window.modelReport.error=String(e);window.ready=true;console.error(e);}
</script></body></html>
