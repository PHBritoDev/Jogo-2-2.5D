<!doctype html>
<html lang="pt-BR"><meta charset="utf-8"><title>Auditoria da caverna de Cinzária</title>
<pre id="result">Carregando a arena…</pre>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import {buildDimensionArena} from '../../dimension-arenas3d.js';
import {nodes,safePathGraph,caveBlocked,caveHeight} from '../../volcano-cave-layout.js';

function check(condition,message){if(!condition)throw Error(message);}
async function run(){
 const scene=new THREE.Scene();
 const renderer=new THREE.WebGLRenderer({antialias:false});
 renderer.setSize(320,180);
 const camera=new THREE.PerspectiveCamera(60,16/9,.08,900);
 scene.fog=new THREE.Fog(0x38303e,12,145);
 const cycles=[];
 for(let cycle=0;cycle<6;cycle++){
  const ready=new Promise((resolve,reject)=>{
   THREE.DefaultLoadingManager.onLoad=resolve;
   THREE.DefaultLoadingManager.onError=url=>reject(Error('Falha ao carregar '+url));
  });
  const arena=buildDimensionArena(THREE,'volcano',{x:0,y:0,z:0,radius:140});
  scene.add(arena.group);arena.group.visible=true;
  await ready;
  // The stone map can finish before the dynamic GLTFLoader import starts.
  // Wait for the actual meshes in every populated batch before profiling.
  const expected=[
   ['Santuário das Cataratas de Fogo','CristalCaverna01.glb'],
   ['Santuário das Cataratas de Fogo','TochaMedievalTripo.glb'],
   ['Santuário • galeria superior','CristalCaverna01.glb'],
   ['Santuário • galeria superior','TochaMedievalTripo.glb'],
   ['Bosque das Veias Ardentes','CristalCaverna01.glb']
  ];
  const deadline=performance.now()+25000;
  for(const [group,file] of expected){
   const owner=arena.group.getObjectByName(group);
   while(!owner?.children.some(o=>o.isInstancedMesh && o.name===file)){
    check(performance.now()<deadline,'GLB ausente em '+group+': '+file);
    await new Promise(resolve=>setTimeout(resolve,25));
   }
  }
  const views=[];
  for(const key of ['overlook','fork','spine']){
   const [x,z]=nodes[key];camera.position.set(x,caveHeight(z)+2,z);
   camera.lookAt(x,2,z-25);
   arena.update(1000,camera,180,{player:camera.position,quality:'low'});
   renderer.render(scene,camera);
   views.push({key,calls:renderer.info.render.calls,triangles:renderer.info.render.triangles});
  }
  // Turning the camera without moving the hero must repopulate instance
  // batches. A camera cut must also work when the real player stays put.
  const hero=new THREE.Vector3(nodes.fork[0],2,nodes.fork[1]);
  const counts=()=>{
   const result=[];
   arena.group.traverse(o=>{if(o.isInstancedMesh)result.push(o.count);});
   return result.join(',');
  };
  camera.position.copy(hero);
  const aim=z=>{
   arena.update(1100,camera,180,{player:hero,quality:'low'});
   camera.lookAt(hero.x,2,z);
   renderer.render(scene,camera);
   return counts();
  };
  const south=aim(hero.z-30),north=aim(hero.z+30);
  check(south!==north,'Girar a câmera deve mudar as instâncias visíveis');
  check(aim(hero.z-30)===south,'As instâncias precisam reaparecer ao retornar');
  // The outer rim of the grove used to cover the forward view from the arcade.
  const [ax,az]=nodes.arcade;
  const forward=new THREE.Raycaster(new THREE.Vector3(ax,caveHeight(az)+2.7,az),
   new THREE.Vector3(0,-.025,-1).normalize(),0,12);
  const rim=arena.group.getObjectByName('Bosque das Veias Ardentes-basalto');
  check(rim && !forward.intersectObject(rim,false).length,'Falésia do bosque encobre a arcada');
  let paths=0;
  for(const [a,b] of safePathGraph){
   const [x,z]=nodes[a],[u,v]=nodes[b],steps=Math.ceil(Math.hypot(u-x,v-z)*3);
   for(let i=0;i<=steps;i++){
    check(!caveBlocked(x+(u-x)*i/steps,z+(v-z)*i/steps,true),a+' → '+b);
    paths++;
   }
  }
  const before={...renderer.info.memory};
  scene.remove(arena.group);arena.dispose();renderer.render(scene,camera);
  const after={...renderer.info.memory};
  if(cycles.length){
   check(after.geometries===cycles[0].after.geometries,'Geometrias acumuladas');
   check(after.textures===cycles[0].after.textures,'Texturas acumuladas');
  }
  cycles.push({cycle:cycle+1,paths,views,before,after});
 }
 renderer.dispose();
 return cycles;
}
window.volcanoAudit=run();
window.volcanoAudit.then(data=>result.textContent=JSON.stringify(data,null,2),e=>result.textContent=e.stack);
</script>
</html>
