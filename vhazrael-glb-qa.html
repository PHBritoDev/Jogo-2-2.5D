<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>VHAZRAEL.glb — auditoria de clipes</title>
<style>html,body{margin:0;background:#1a1216;color:#eee;font:13px sans-serif}#legend{position:absolute;left:12px;top:10px;background:#000b;padding:8px 10px;z-index:3;max-width:60vw}#scene{width:100vw;height:100vh;display:block}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script></head><body><div id="legend">VHAZRAEL.glb</div><canvas id="scene"></canvas>
<script type="module">
/* Mod 320 — auditoria do VHAZRAEL.glb (QA, fora do jogo): lista os clipes REAIS (nome, duração, trilhas, deslocamento do
   quadril = root motion), mede altura/caixa, localiza a arma pela malha presa à mão e posa qualquer clipe em qualquer
   instante para fotos lado a lado. Usado por tools/visual-lab/vhazrael-glb-qa.cjs. */
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
const canvas=document.getElementById('scene'),renderer=new THREE.WebGLRenderer({canvas,antialias:true,preserveDrawingBuffer:true});
renderer.setSize(innerWidth,innerHeight,false);renderer.setPixelRatio(1);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.25;
const scene=new THREE.Scene();scene.background=new THREE.Color(0x3a3036);
scene.add(new THREE.HemisphereLight(0xf0e6ff,0x40303a,2.2));const key=new THREE.DirectionalLight(0xffe8d0,3);key.position.set(3,6,5);scene.add(key);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(30,30),new THREE.MeshStandardMaterial({color:0x5a5058,roughness:1}));floor.rotation.x=-Math.PI/2;scene.add(floor);
scene.add(new THREE.GridHelper(10,10,0x9a8a94,0x6a5a64));
const camera=new THREE.PerspectiveCamera(40,innerWidth/innerHeight,.05,200);
const gltf=await new GLTFLoader().loadAsync('./VHAZRAEL.glb');const model=gltf.scene;scene.add(model);
const mixer=new THREE.AnimationMixer(model),clips=gltf.animations;let action=null;
const bones={};model.traverse(o=>{if(o.isBone)bones[o.name]=o;});
function bbox(){model.updateMatrixWorld(true);const b=new THREE.Box3();model.traverse(o=>{if(o.isSkinnedMesh){o.skeleton.update();const p=o.geometry.attributes.position,v=new THREE.Vector3();for(let i=0;i<p.count;i+=7){v.fromBufferAttribute(p,i);o.applyBoneTransform(i,v);v.applyMatrix4(o.matrixWorld);b.expandByPoint(v);}}});return b;}
window.pose=(name,t)=>{const c=clips.find(c=>c.name===name);if(!c)return null;mixer.stopAllAction();action=mixer.clipAction(c);action.reset().play();mixer.setTime(Math.min(t,c.duration-1e-3));model.updateMatrixWorld(true);const b=bbox();const hip=bones.Hips.getWorldPosition(new THREE.Vector3()),rh=bones.RightHand.getWorldPosition(new THREE.Vector3()),hd=bones.Head.getWorldPosition(new THREE.Vector3());return{min:b.min.toArray().map(v=>+v.toFixed(3)),max:b.max.toArray().map(v=>+v.toFixed(3)),hip:hip.toArray().map(v=>+v.toFixed(3)),hand:rh.toArray().map(v=>+v.toFixed(3)),head:hd.toArray().map(v=>+v.toFixed(3))};};
window.catalog=()=>clips.map(c=>{const hipT=c.tracks.find(t=>/Hips\.position$/.test(t.name));let dx=0,dy=0,dz=0,ry=0;if(hipT){const v=hipT.values,n=v.length/3;dx=v[(n-1)*3]-v[0];dy=Math.max(...Array.from({length:n},(_,i)=>v[i*3+1]))-Math.min(...Array.from({length:n},(_,i)=>v[i*3+1]));dz=v[(n-1)*3+2]-v[2];}
 return{name:c.name,dur:+c.duration.toFixed(2),tracks:c.tracks.length,hipDx:+(dx*.01).toFixed(3),hipDz:+(dz*.01).toFixed(3),hipRangeY:+(dy*.01).toFixed(3)};});
window.view=(az=0,el=.15,dist=4.2,ty=1.2)=>{camera.position.set(Math.sin(az)*dist*Math.cos(el),ty+Math.sin(el)*dist,Math.cos(az)*dist*Math.cos(el));camera.lookAt(0,ty,0);renderer.render(scene,camera);};
window.label=s=>{document.getElementById('legend').textContent=s;};
window.weaponInfo=()=>{ // vértices pesados na mão direita: comprimento da arma (se fizer parte da malha)
 model.updateMatrixWorld(true);const sk=[];model.traverse(o=>{if(o.isSkinnedMesh)sk.push(o);});const out={};for(const m of sk){const idx=m.skeleton.bones.findIndex(b=>b.name==='RightHand');const si=m.geometry.attributes.skinIndex,sw=m.geometry.attributes.skinWeight,p=m.geometry.attributes.position,v=new THREE.Vector3(),hand=bones.RightHand.getWorldPosition(new THREE.Vector3());let n=0,far=0,tip=null;
 for(let i=0;i<p.count;i++){let w=0;for(let k=0;k<4;k++)if([si.getX,si.getY,si.getZ,si.getW][k].call(si,i)===idx)w+=[sw.getX,sw.getY,sw.getZ,sw.getW][k].call(sw,i);if(w<.5)continue;n++;v.fromBufferAttribute(p,i);m.applyBoneTransform(i,v);v.applyMatrix4(m.matrixWorld);const d=v.distanceTo(hand);if(d>far){far=d;tip=v.toArray().map(x=>+x.toFixed(3));}}
 out[m.name||'mesh']={handVerts:n,farthest:+far.toFixed(3),tip,hand:hand.toArray().map(x=>+x.toFixed(3))};}return out;};
window.curves=(name,hz=30)=>{const c=clips.find(c=>c.name===name);if(!c)return null;mixer.stopAllAction();const a=mixer.clipAction(c);a.reset().play();const out=[];const v=new THREE.Vector3();
 for(let i=0;i<=Math.ceil(c.duration*hz);i++){const t=Math.min(i/hz,c.duration-1e-3);mixer.setTime(t);model.updateMatrixWorld(true);const h=bones.RightHand.getWorldPosition(new THREE.Vector3()),hip=bones.Hips.getWorldPosition(v.clone()),l=bones.LeftHand.getWorldPosition(new THREE.Vector3());out.push([+t.toFixed(3),+hip.y.toFixed(3),...h.toArray().map(x=>+x.toFixed(3)),...l.toArray().map(x=>+x.toFixed(3))]);}return{dur:c.duration,hz,frames:out};};
window.qaReady=true;window.view();label('VHAZRAEL.glb — '+clips.length+' clipes');
</script></body></html>
