<!doctype html><html lang="pt-BR"><meta charset="utf-8"><title>Ruptura em X QA</title><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script><style>body{margin:0;background:#141922;color:white;font:14px system-ui}label{position:absolute;top:6px;left:12px}</style><label>Ruptura em X — laboratório WebGL</label><script type="module">
import * as T from 'three';import {createXRuptureVFX} from './skill-x-rupture-vfx3d.js';
const renderer=new T.WebGLRenderer({antialias:false,preserveDrawingBuffer:true});renderer.setSize(960,540);renderer.setPixelRatio(1);document.body.append(renderer.domElement);
const scene=new T.Scene();scene.background=new T.Color('#1c2430');const camera=new T.PerspectiveCamera(48,960/540,.1,100);const hemi=new T.HemisphereLight(0xb0c9e6,0x24221a,2);scene.add(hemi);const floor=new T.Mesh(new T.PlaneGeometry(40,40),new T.MeshStandardMaterial({color:0x364641,roughness:.9}));floor.rotation.x=-Math.PI/2;scene.add(floor);const grid=new T.GridHelper(20,20,0x617068,0x43524c);grid.position.y=.02;scene.add(grid);
const fx=createXRuptureVFX(T,scene,{ground:()=>0});window.qa={ready:true,show:({phase='travel',age=.3,angle='front'}={})=>{const s={active:true,phase,time:3+age,age,p:{x:0,y:2.5,z:0},dir:{x:0,z:1},hitAtTime:-1,at:{x:0,y:2.5,z:0}};camera.position.set(angle==='side'?9:0,angle==='side'?4.2:3.5,angle==='side'?0:11);camera.lookAt(0,2.5,0);fx.update(s,camera,1);renderer.render(scene,camera);return {phase,age,angle,calls:renderer.info.render.calls,triangles:renderer.info.render.triangles,geometries:renderer.info.memory.geometries,textures:renderer.info.memory.textures};}};window.qa.show({phase:'travel',age:.3,angle:'front'});</script>
