<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Enemy3 · prévia</title>
<style>body{margin:0;background:#07050b;color:#f3e2ff;font:14px system-ui}canvas{display:block}header{position:absolute;top:12px;left:16px;pointer-events:none}h1{font:19px Georgia;letter-spacing:2px;color:#ff6fa0;margin:0 0 4px}footer{position:absolute;bottom:14px;left:10px;right:10px;display:flex;flex-wrap:wrap;gap:4px}button{background:#24102a;border:1px solid #ff3f7e;color:#fde8ff;padding:9px 10px;border-radius:8px}#info{position:absolute;top:64px;left:16px;font:12px monospace;color:#d8c0ff;white-space:pre}</style>
<header><h1>ENEMY3 · ABISSAL</h1><p>Tempestade de Nadir · Barragem Abissal · Singularidade Abissal · Katana Dragão Carmim</p></header><div id="info"></div>
<footer><button data-k="nadir">TEMPESTADE</button><button data-k="barrage">BARRAGEM</button><button data-k="singularity">SINGULARIDADE</button><button data-k="Katana_Presa">PRESA</button><button data-k="Katana_Iai">IAI</button><button data-k="Katana_Dragao">DRAGÃO</button><button id="boss">MINI-CHEFE</button><button id="quality">QUALIDADE</button></footer>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
/* MOD 245 — prévia isolada (sem progresso, sem save): o MESMO runtime da esquadra do jogo, com os GLBs reais do Enemy3/Enemy4,
   a katana, as poses de conjuração e o VFX abissal. ?k=poder&boss=1&low=1&t=segundos congela num instante (evidência). */
import * as T from 'three';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';import {clone as skClone} from 'three/addons/utils/SkeletonUtils.js';
import {createEnemy1SquadRuntime} from './enemy1-squad-runtime3d.js';
const qs=new URLSearchParams(location.search);let kind=qs.get('k')||'singularity',boss=qs.has('boss'),quality=qs.has('low')?0:1;const freezeAt=qs.has('t')?+qs.get('t'):null;
const scene=new T.Scene();scene.background=new T.Color('#1a1626');scene.fog=new T.Fog('#1a1626',40,120);const camera=new T.PerspectiveCamera(52,innerWidth/innerHeight,.1,300);
const renderer=new T.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.toneMapping=T.ACESFilmicToneMapping;renderer.outputColorSpace=T.SRGBColorSpace;document.body.appendChild(renderer.domElement);
const hemi=new T.HemisphereLight(0xd8d4ff,0x3a3040,1.7);scene.add(hemi);const sun=new T.DirectionalLight(0xfff0dd,1.6);sun.position.set(6,12,4);scene.add(sun);
const floor=new T.Mesh(new T.PlaneGeometry(220,220),new T.MeshStandardMaterial({color:0x3a4a34,roughness:.95}));floor.rotation.x=-Math.PI/2;scene.add(floor);
for(let i=0;i<26;i++){const a=i/26*6.283,r=24+(i%3)*5,tr=new T.Mesh(new T.ConeGeometry(1.6,7,7),new T.MeshStandardMaterial({color:0x1f3424,roughness:1}));tr.position.set(Math.cos(a)*r,3.5,Math.sin(a)*r);scene.add(tr);}
const ground=()=>0;const heroM=new T.Mesh(new T.CapsuleGeometry(.32,1.1,6,12),new T.MeshStandardMaterial({color:0xe8e2d0}));heroM.position.y=.87;scene.add(heroM);
const hero={id:'hero',team:'hero',x:0,y:0,z:0,vx:0,vz:0,radius:.42,height:1.8,alive:true,priority:1,iframes:false,air:0};
const loader=new GLTFLoader(),rigs={};
const DEF={e3:{file:'./Enemy3.glb',roles:{idle:'_01a15ab5_eeba_71ae_a438_b85a938940fc',walk:'Walking',run:'Running',attack:'Attack',cast:'Skill_03',dash:'_01a15ab0_deed_76a9_818c_47f5fc81ba40',death:'Dead'}},
 e4:{file:'./Enemy4.glb',roles:{idle:'_01a15ace_9e83_7761_a901_661f649d465a',walk:'Walking',run:'Running',attack:'Triple_Combo_Attack',cast:'Skill_03',dash:'_01a15ad2_c637_77d6_b5f4_1b96b9e71d4b',death:'Dead'}}};
const sp=qs.get('sp')==='4'?4:3,KB=()=>sp===4?(boss?'e4boss':'e4'):(boss?'e3boss':'e3');
async function load(k){if(rigs[k])return rigs[k];const g=await loader.loadAsync(DEF[k].file);const model=g.scene,mixer=new T.AnimationMixer(model),actions={};for(const [role,name] of Object.entries(DEF[k].roles)){const c=g.animations.find(a=>a.name===name);if(c)actions[role]=mixer.clipAction(c);}return rigs[k]={model,actions};}
let rt=null,time=0,heroHp=0,info=document.getElementById('info');
async function start(){
 await load('e3');await load('e4');if(rt)rt.dispose();heroHp=0;time=0;hero.x=0;hero.z=0;
 rt=createEnemy1SquadRuntime({T,scene,ground,blocked:()=>false,los:()=>true,source:k=>rigs[k==='e4'||k==='e4boss'?'e4':'e3'],clone:m=>skClone(m),measure:o=>new T.Box3().setFromObject(o),heroHeight:()=>1.8,damageTarget:(id,n)=>{heroHp+=n;return'hit';},event:()=>{}});
 const sq=rt.start([{x:0,z:boss?7:11,yaw:Math.PI,kind:KB()}],{seed:5});const a=sq.actors[0];a.alert=1e9;a.decideT=1e9;
 sq.setTargets([hero]);if(kind==='katana'){}else if(kind.startsWith('Katana')){hero.z=boss?2.4:0;sq.startMelee(a,hero,kind);}else{a.cds[kind]=0;sq.startCast(a,hero,kind);}
}
function cam(){const sq=rt&&rt.squad,a=sq&&sq.actors[0];if(!a)return;const s=sq.spells[0];
 if(kind==='katana'){const b=rt.body(a.id),p=b&&b.weaponRoot?b.weaponRoot.getWorldPosition(new T.Vector3()):new T.Vector3(a.x,1.3,a.z);camera.position.set(p.x-1.7,p.y+.25,p.z-1.5);camera.lookAt(p.x-.2,p.y-.05,p.z-.5);return;}
 if(kind==='nadir'&&qs.has('ground')){camera.position.set(-7,7.5,-9);camera.lookAt(0,0,1);return;}
 if(kind==='nadir'){camera.position.set(-6,2.2,-5);camera.lookAt(a.x*.4,7,a.z*.6);return;}
 if(kind==='sanctum'||kind==='drill'||kind==='cage'){camera.position.set(-6,5.5,-6.5);camera.lookAt(0,.8,3);return;}
 if(kind==='constellation'){camera.position.set(a.x+6,3.4,a.z-9);camera.lookAt(a.x,3.4,a.z+1);return;}
 if(kind==='barrage'){camera.position.set(a.x+5.5,3,a.z-10.5);camera.lookAt(a.x,3.2,a.z+1);return;}
 if(kind.startsWith('Katana')){camera.position.set(a.x+4.6,2.2,a.z-3.2);camera.lookAt(a.x,1.3,a.z-1);return;}
 if(s&&(s.phase==='dome'||s.phase==='erode'||s.phase==='implode')){camera.position.set(s.x+7,3.2,s.z-7.5);camera.lookAt(s.x,1.4,s.z);return;}
 if(s&&(s.phase==='fly'||s.phase==='fall')){camera.position.set(s.x+3.5,s.y+1.2,s.z-3.5);camera.lookAt(s.x,s.y,s.z);return;}
 camera.position.set(a.x+3.4,2.4,a.z-3.6);camera.lookAt(a.x,2.1,a.z-.4);
}
function step(dt){time+=dt;rt.update(dt,{targets:[hero],camera,quality});heroM.position.set(hero.x,.87,hero.z);const k=rt.dim;hemi.intensity=1.7*(1-.42*k);sun.intensity=1.6*(1-.55*k);}
function frame(){requestAnimationFrame(frame);if(!rt)return;if(freezeAt===null){cam();step(Math.min(.033,1/60));}
 const sq=rt.squad;info.textContent=(sq?sq.spells.map(s=>s.type+':'+s.phase).join(' '):'')+'\nt '+time.toFixed(2)+'  dano '+heroHp+'  chamadas '+renderer.info.render.calls;renderer.render(scene,camera);}
start().then(()=>{if(freezeAt!==null){const n=Math.round(freezeAt*60);for(let i=0;i<n;i++){cam();step(1/60);}cam();step(0);window.__ready=true;}frame();});
for(const b of document.querySelectorAll('[data-k]'))b.onclick=()=>{kind=b.dataset.k;start();};document.getElementById('boss').onclick=()=>{boss=!boss;start();};document.getElementById('quality').onclick=()=>{quality=quality?0:1;};
window.__preview={get rt(){return rt;},renderer,camera,hero,scene,get state(){return rt&&rt.squad&&rt.squad.snapshot();},get calls(){return renderer.info.render.calls;}};
</script></html>
