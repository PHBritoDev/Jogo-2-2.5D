<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Teste 3D — Dimensões e Jornada</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b111a;color:#f2f4ff;font:14px system-ui;display:flex;flex-direction:column;height:100dvh}
header{display:flex;align-items:center;gap:8px;padding:8px 10px;background:#141b2b;border-bottom:1px solid #526184;flex-wrap:wrap}
h1{font-size:14px;margin:0 9px 0 0;white-space:nowrap}
nav{display:flex;align-items:center;gap:6px;flex:1;overflow-x:auto;padding:2px 0;scrollbar-width:thin}
button,a{flex:0 0 auto;background:#202d45;color:#fff;border:1px solid #7383a5;border-radius:8px;padding:8px 10px;font:700 12px system-ui;text-decoration:none;min-height:36px}
button{cursor:pointer}button.active{border-color:#efd087;background:#55411f}button:focus-visible,a:focus-visible{outline:2px solid #ffd47b;outline-offset:2px}
main{flex:1;min-height:0}iframe{width:100%;height:100%;border:0;background:#101b1c}
footer{display:flex;gap:10px;justify-content:space-between;align-items:center;padding:6px 10px;background:#141b2b;font-size:11px;color:#c5cbe2}
@media(max-width:600px){header{padding:5px 7px}h1{width:100%;font-size:12px}button,a{font-size:11px;padding:6px 8px;min-height:32px}footer{padding:4px 8px}}
</style>
</head>
<body>
<header>
<h1>⚔ Testar: dimensões e jornada</h1>
<nav aria-label="Destinos de teste">
<button type="button" data-dim="bishop1">Bispo 1 · VHAZRAEL</button>
<button type="button" data-dim="bishop2">Bispo 2 · VORGAZHEK</button>
<button type="button" data-dim="bishop3">Bispo 3 · ZAR'KHAEL</button>
<button type="button" data-dim="bishop4">Bispo 4 · VÉRAXION</button>
<button type="button" data-dim="greed">Ganância</button>
<button type="button" data-journey="vale">🌿 Vale do Entardecer · começar jornada</button>
</nav>
<a href="./index.html">↩ Jogo</a>
</header>
<main><iframe id="game" title="Jogo 3D" allow="fullscreen;autoplay"></iframe></main>
<footer><span>O Vale é o INÍCIO da viagem: siga pelas montanhas e pela ponte até Cinzária. Testes de dimensões não salvam o progresso.</span><span id="status" role="status"></span><button id="open" type="button">Tela cheia</button></footer>
<script type="module">
import {worldURL} from './shell-navigation.js';
const game=document.querySelector('#game'), toggle=document.querySelector('#open');
const status=document.querySelector('#status'), buttons=[...document.querySelectorAll('nav button')];
const meta=await import('./build-info.js?stamp='+Date.now());
function travel(key) {
  const params=new URLSearchParams(location.search);
  params.delete('jornadaInicio');params.delete('testeDimensao');
  if(key==='vale') params.set('jornadaInicio','1');
  else params.set('testeDimensao',key);
  params.set('debug3d','1');params.set('adm','1');
  const url=worldURL(params,meta.BUILD);
  game.src=url;
  const search=url.slice(url.indexOf('?'));
  history.replaceState(null,'',location.pathname+search);
  for(const button of buttons) button.classList.toggle('active',(button.dataset.dim||button.dataset.journey)===key);
  status.textContent='Carregando destino…';
}
game.addEventListener('load',()=>{status.textContent='';game.focus();});
for(const button of buttons) button.onclick=()=>travel(button.dataset.dim||button.dataset.journey);
toggle.onclick=async()=>{
  try {
    if(document.fullscreenElement) await document.exitFullscreen();
    else await document.documentElement.requestFullscreen();
  } catch { status.textContent='Tela cheia indisponível neste navegador.'; }
};
document.addEventListener('fullscreenchange',()=>{toggle.textContent=document.fullscreenElement?'Sair da tela cheia':'Tela cheia';game.focus();});
travel(new URLSearchParams(location.search).get('testeDimensao')||'vale');
</script></body></html>
